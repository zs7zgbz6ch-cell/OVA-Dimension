<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OVA-D LAB">
<meta name="theme-color" content="#090704">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png">
<title>OVA-D LAB · Scene Stage</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090704;color:#f2dfb1;font-family:Georgia,serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{position:fixed;inset:0}
#scene{position:fixed;inset:-2px;background:url('assets/berklith-tavern.jpg') center/cover no-repeat;overflow:hidden}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 57%,rgba(0,0,0,.28) 100%)}
.actor{position:absolute;width:auto;transform:translate(-50%,-100%);transform-origin:50% 100%;filter:drop-shadow(0 9px 7px rgba(0,0,0,.24));touch-action:none}.actor.selected{filter:drop-shadow(0 0 4px rgba(255,220,132,.95)) drop-shadow(0 10px 7px rgba(0,0,0,.28))}
.actor-label{position:absolute;z-index:7;transform:translate(-50%,-50%);padding:3px 6px;border-radius:7px;border:1px solid rgba(224,184,103,.65);background:rgba(13,9,5,.76);font-size:8px;letter-spacing:.07em;white-space:nowrap;pointer-events:none}.actor-label.selected{background:rgba(105,71,29,.92);border-color:#f0cb7d}
.topbar{position:fixed;z-index:20;top:max(7px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:8px;pointer-events:none}.badge,.status{padding:6px 9px;border:1px solid rgba(224,184,103,.38);background:rgba(13,9,5,.67);backdrop-filter:blur(10px);border-radius:9px;font-size:9px;letter-spacing:.09em;pointer-events:auto}.status{text-align:right}
#editor{position:fixed;z-index:30;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));padding:8px;border:1px solid rgba(224,184,103,.5);background:rgba(13,9,5,.86);backdrop-filter:blur(14px);border-radius:14px}.row{display:flex;align-items:center;gap:7px;margin-bottom:7px}.row:last-child{margin-bottom:0}
#spotName{min-width:0;flex:1;height:31px;border:1px solid rgba(224,184,103,.42);border-radius:8px;background:rgba(36,25,14,.95);color:#f5e5bf;padding:0 9px;text-transform:uppercase;font-size:11px;letter-spacing:.07em}.btn{height:31px;border:1px solid rgba(224,184,103,.52);border-radius:8px;background:rgba(38,27,15,.96);color:#f2dfb1;padding:0 10px;font-size:9px;letter-spacing:.07em;white-space:nowrap}.btn:active{transform:scale(.97)}.btn.primary{border-color:#e0b867;background:rgba(93,64,29,.96)}.btn.danger{border-color:rgba(191,116,88,.65)}
.control{display:grid;grid-template-columns:18px 1fr 43px 26px 26px;align-items:center;gap:5px;flex:1;min-width:0}.control label{font-size:9px;letter-spacing:.08em}.control output{font-size:9px;text-align:right;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#d6aa58}.nudge{height:27px;padding:0;border:1px solid rgba(224,184,103,.38);border-radius:7px;background:rgba(40,28,16,.94);color:#f2dfb1;font-size:14px}
#uiToggle{position:fixed;z-index:90;right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));height:29px;border:1px solid rgba(224,184,103,.52);border-radius:9px;background:rgba(13,9,5,.82);backdrop-filter:blur(10px);color:#f2dfb1;padding:0 9px;font:8px Georgia,serif;letter-spacing:.08em}body.ui-hidden #editor,body.ui-hidden .topbar{display:none}body:not(.ui-hidden) #uiToggle{bottom:calc(max(7px,env(safe-area-inset-bottom)) + 118px)}
.actor.route-moving{pointer-events:none}body.route-playing #editor button:not(#stopRoute),body.route-playing #editor input{opacity:.55;pointer-events:none}
#toast{position:fixed;z-index:60;left:50%;top:18%;transform:translate(-50%,-50%);opacity:0;transition:opacity .18s;padding:8px 12px;border:1px solid rgba(224,184,103,.55);background:rgba(13,9,5,.9);border-radius:10px;font-size:10px;letter-spacing:.08em;pointer-events:none}#toast.show{opacity:1}
@media(max-width:760px){body:not(.ui-hidden) #uiToggle{bottom:calc(max(7px,env(safe-area-inset-bottom)) + 105px)}.badge,.status{font-size:7px;padding:5px 7px}#editor{padding:7px}.row{gap:5px;margin-bottom:5px}.btn{height:28px;padding:0 7px;font-size:8px}#spotName{height:28px;font-size:9px}.control{grid-template-columns:14px 1fr 36px 23px 23px;gap:3px}.control label,.control output{font-size:8px}.nudge{height:24px}}
@media(orientation:portrait){#scene:after{content:"ROTATE FOR SCENE STAGE";position:absolute;inset:0;display:grid;place-items:center;background:#090704;color:#d8b46c;font-size:12px;letter-spacing:.18em;z-index:80}#editor,.topbar,#uiToggle{visibility:hidden}}
</style></head><body>
<div id="scene"><div class="vignette"></div></div>
<div class="topbar"><div class="badge">OVA-D LAB · 01C PASS 2 · SCENE STAGE</div><div class="status" id="status"></div></div>
<div id="editor">
<div class="row"><input id="spotName"><button class="btn primary" id="add">+ SPOT</button><button class="btn" id="duplicate">DUPLICATE</button><button class="btn danger" id="remove">DELETE</button></div>
<div class="row">
<div class="control"><label>X</label><input id="x" type="range" min="-25" max="125" step=".1"><output id="xo"></output><button class="nudge" data-nudge="x,-.5">−</button><button class="nudge" data-nudge="x,.5">+</button></div>
<div class="control"><label>Y</label><input id="y" type="range" min="0" max="150" step=".1"><output id="yo"></output><button class="nudge" data-nudge="y,-.5">−</button><button class="nudge" data-nudge="y,.5">+</button></div>
<div class="control"><label>S</label><input id="scale" type="range" min="20" max="100" step=".5"><output id="so"></output><button class="nudge" data-nudge="scale,-1">−</button><button class="nudge" data-nudge="scale,1">+</button></div>
</div>
<div class="row"><button class="btn primary" id="save">SAVE STATE</button><button class="btn" id="copy">COPY STATE</button><button class="btn" id="labels">LABELS: ON</button><button class="btn" id="reset">RESET DEFAULTS</button><button class="btn primary" id="routeBarStairs">▶ BAR → STAIRS</button><button class="btn" id="routeReverse">▶ STAIRS → BAR</button><button class="btn danger" id="stopRoute">■ STOP</button></div>
</div><button id="uiToggle">HIDE UI</button><div id="toast"></div>
<script>
const KEY='ovad_scene_stage_v02',scene=document.querySelector('#scene'),status=document.querySelector('#status'),nameInput=document.querySelector('#spotName'),xEl=document.querySelector('#x'),yEl=document.querySelector('#y'),sEl=document.querySelector('#scale'),xo=document.querySelector('#xo'),yo=document.querySelector('#yo'),so=document.querySelector('#so'),toastEl=document.querySelector('#toast');
const DEFAULTS=[
{id:'spot_01',name:'SPOT_01',x:26.44,y:66.55,scale:25},
{id:'spot_02',name:'SPOT_02',x:35.4,y:67.74,scale:27},
{id:'spot_03',name:'SPOT_03',x:45.52,y:80.7,scale:42},
{id:'spot_04',name:'SPOT_04',x:94.47,y:95.82,scale:66},
{id:'spot_05',name:'SPOT_05',x:31.1,y:72.87,scale:35},
{id:'spot_06',name:'SPOT_06',x:54.33,y:68.5,scale:23},
{id:'spot_07',name:'SPOT_07',x:23.86,y:103.14,scale:73},
{id:'spot_08',name:'SPOT_08',x:48.38,y:117.5,scale:95},
{id:'spot_09',name:'SPOT_09',x:76.3,y:70.34,scale:24.5}
];
let state={scene:'BERKLITH_TAVERN',spots:JSON.parse(JSON.stringify(DEFAULTS)),selected:'spot_03',labels:true},drag=null,toastTimer;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1100)}
function sel(){return state.spots.find(s=>s.id===state.selected)||state.spots[0]}function safeId(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'_'+Date.now()}function uniqueName(b){let n=b.toUpperCase(),i=2;while(state.spots.some(s=>s.name===n))n=b.toUpperCase()+'_'+i++;return n}
function save(silent=false){localStorage.setItem(KEY,JSON.stringify(state));if(!silent)toast('STATE SAVED')}function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.spots?.length)state=v}catch(e){}if(!state.spots.some(s=>s.id===state.selected))state.selected=state.spots[0].id}
function outputs(){xo.value=(+xEl.value).toFixed(1);yo.value=(+yEl.value).toFixed(1);so.value=(+sEl.value).toFixed(1)}
function render(){scene.querySelectorAll('.actor,.actor-label').forEach(e=>e.remove());state.spots.forEach(s=>{let a=document.createElement('img');a.src='assets/test-character-01.png';a.className='actor'+(s.id===state.selected?' selected':'');a.dataset.id=s.id;a.style.left=s.x+'%';a.style.top=s.y+'%';a.style.height=s.scale+'vh';scene.appendChild(a);let l=document.createElement('div');l.className='actor-label'+(s.id===state.selected?' selected':'');l.dataset.label=s.id;l.textContent=s.name;l.style.left=s.x+'%';l.style.top=Math.max(4,s.y-s.scale*.96)+'%';l.style.display=state.labels?'block':'none';scene.appendChild(l);a.addEventListener('pointerdown',startDrag)});let s=sel();nameInput.value=s.name;xEl.value=s.x;yEl.value=s.y;sEl.value=s.scale;outputs();status.textContent=state.spots.length+' SPOTS · '+s.name;document.querySelector('#labels').textContent='LABELS: '+(state.labels?'ON':'OFF')}
function update(){let s=sel();s.x=+xEl.value;s.y=+yEl.value;s.scale=+sEl.value;save(true);render()}[xEl,yEl,sEl].forEach(e=>e.addEventListener('input',update));
nameInput.addEventListener('change',()=>{let s=sel(),n=(nameInput.value||s.name).trim().toUpperCase().replace(/\s+/g,'_');if(state.spots.some(q=>q.id!==s.id&&q.name===n))n=uniqueName(n);s.name=n;save(true);render()});
function startDrag(e){
 e.preventDefault();
 state.selected=e.currentTarget.dataset.id;
 const s=sel(),r=scene.getBoundingClientRect();
 // Preserve the exact point where the actor was grabbed. Grabbing her head,
 // waist, etc. no longer snaps her feet/anchor to the finger.
 drag={
   id:state.selected,
   offsetX:e.clientX-(r.left+(s.x/100)*r.width),
   offsetY:e.clientY-(r.top+(s.y/100)*r.height)
 };
 e.currentTarget.classList.add('selected');
 const lab=scene.querySelector('.actor-label[data-label="'+s.id+'"]');if(lab)lab.classList.add('selected');
 status.textContent=state.spots.length+' SPOTS · '+s.name;
 e.currentTarget.setPointerCapture(e.pointerId);
 e.currentTarget.addEventListener('pointermove',moveDrag);
 e.currentTarget.addEventListener('pointerup',endDrag,{once:true});
 e.currentTarget.addEventListener('pointercancel',endDrag,{once:true});
}
function moveDrag(e){
 if(!drag)return;
 let r=scene.getBoundingClientRect(),s=sel();
 const anchorX=e.clientX-drag.offsetX,anchorY=e.clientY-drag.offsetY;
 s.x=Math.max(-25,Math.min(125,(anchorX-r.left)/r.width*100));
 s.y=Math.max(0,Math.min(150,(anchorY-r.top)/r.height*100));
 e.currentTarget.style.left=s.x+'%';e.currentTarget.style.top=s.y+'%';
 let l=scene.querySelector('.actor-label[data-label="'+s.id+'"]');
 if(l){l.style.left=s.x+'%';l.style.top=Math.max(4,s.y-s.scale*.96)+'%'}
 xEl.value=s.x;yEl.value=s.y;outputs();status.textContent=state.spots.length+' SPOTS · '+s.name;
}
function endDrag(){drag=null;save(true);render()}
document.querySelector('#add').onclick=()=>{let next=1;while(state.spots.some(s=>s.name===('SPOT_'+String(next).padStart(2,'0'))))next++;let nm='SPOT_'+String(next).padStart(2,'0'),q={id:safeId(nm),name:nm,x:50,y:75,scale:45};state.spots.push(q);state.selected=q.id;save(true);render();toast('SPOT ADDED')};
document.querySelector('#duplicate').onclick=()=>{let s=sel(),q={...s,id:safeId(s.name),name:uniqueName(s.name),x:Math.min(125,s.x+3),y:Math.min(150,s.y+2)};state.spots.push(q);state.selected=q.id;save(true);render();toast('DUPLICATED')};
document.querySelector('#remove').onclick=()=>{if(state.spots.length<=1)return toast('KEEP ONE SPOT');let i=state.spots.findIndex(s=>s.id===state.selected);state.spots.splice(i,1);state.selected=state.spots[Math.max(0,i-1)].id;save(true);render();toast('SPOT DELETED')};
document.querySelector('#save').onclick=()=>save();document.querySelector('#labels').onclick=()=>{state.labels=!state.labels;save(true);render()};
document.querySelector('#reset').onclick=()=>{if(confirm('Reset Scene Stage to the default four spots?')){state={scene:'BERKLITH_TAVERN',spots:JSON.parse(JSON.stringify(DEFAULTS)),selected:'spot_03',labels:true};save(true);render();toast('DEFAULTS RESTORED')}};
document.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>{let [k,d]=b.dataset.nudge.split(','),s=sel();s[k]=+(s[k]+(+d)).toFixed(2);save(true);render()});
document.querySelector('#copy').onclick=async()=>{let ex={version:'OVA-D_SCENE_STAGE_0.2',scene:state.scene,spots:{}};state.spots.forEach(s=>ex.spots[s.name]={x:+s.x.toFixed(2),y:+s.y.toFixed(2),scale:+s.scale.toFixed(2)});let t=JSON.stringify(ex,null,2);try{await navigator.clipboard.writeText(t);toast('STATE COPIED')}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('STATE COPIED')}};
const uiToggle=document.querySelector('#uiToggle');
uiToggle.onclick=()=>{document.body.classList.toggle('ui-hidden');uiToggle.textContent=document.body.classList.contains('ui-hidden')?'SHOW UI':'HIDE UI'};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let routeToken=0;
function routeActor(id){return scene.querySelector('.actor[data-id="'+id+'"]')}
function pose(a,p,d=0,e='cubic-bezier(.22,.61,.36,1)'){
 a.style.transition=d?`left ${d}ms ${e},top ${d}ms ${e},width ${d}ms ${e},opacity ${d}ms ease`:'none';
 a.style.left=p.x+'%';a.style.top=p.y+'%';a.style.width=p.scale+'%';if(p.opacity!==undefined)a.style.opacity=p.opacity;
}
async function leg(a,p,d,t,e){if(t!==routeToken)return false;pose(a,p,d,e);await sleep(d);return t===routeToken}
function stopRouteNow(){routeToken++;document.body.classList.remove('route-playing');render()}
async function playRoute(reverse=false){
 if(document.body.classList.contains('route-playing'))return;
 const token=++routeToken,names=reverse?['SPOT_04','SPOT_03','SPOT_05','SPOT_01']:['SPOT_01','SPOT_05','SPOT_03','SPOT_04'];
 const pts=names.map(n=>state.spots.find(q=>q.name===n));
 if(pts.some(x=>!x)){toast('Need SPOT_01/03/04/05');return}
 document.body.classList.add('route-playing');state.selected=pts[0].id;render();
 const a=routeActor(pts[0].id);a.classList.add('route-moving');a.style.zIndex=40;pose(a,{...pts[0],opacity:1});await sleep(450);
 for(let i=1;i<pts.length;i++)if(!await leg(a,{...pts[i],opacity:1},i===pts.length-1?2400:2100,token,'cubic-bezier(.45,.05,.3,1)'))return;
 if(!reverse){await sleep(550);let q=pts[3];if(!await leg(a,{x:q.x+3.5,y:q.y-25,scale:q.scale*.82,opacity:.08},2200,token,'cubic-bezier(.4,0,.6,1)'))return}
 await sleep(300);
 if(token===routeToken){document.body.classList.remove('route-playing');a.classList.remove('route-moving');toast(reverse?'Route complete · BAR':'Route complete · UPSTAIRS')}
}
document.querySelector('#routeBarStairs').onclick=()=>playRoute(false);
document.querySelector('#routeReverse').onclick=()=>playRoute(true);
document.querySelector('#stopRoute').onclick=stopRouteNow;

load();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
