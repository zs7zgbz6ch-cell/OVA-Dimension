<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OVA-D LAB">
<meta name="theme-color" content="#090704">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png">
<title>OVA-D LAB · Semantic Scene Stage</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090704;color:#f2dfb1;font-family:Georgia,serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{position:fixed;inset:0}
#scene{position:fixed;inset:-2px;background:url('assets/berklith-tavern.jpg') center/cover no-repeat;overflow:hidden}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 57%,rgba(0,0,0,.28) 100%)}
.actor{position:absolute;width:auto;transform:translate(-50%,-100%);transform-origin:50% 100%;filter:drop-shadow(0 9px 7px rgba(0,0,0,.24));touch-action:none}.actor.selected{filter:drop-shadow(0 0 4px rgba(255,220,132,.95)) drop-shadow(0 10px 7px rgba(0,0,0,.28))}
.actor-label{position:absolute;z-index:7;transform:translate(-50%,-50%);padding:3px 6px;border-radius:7px;border:1px solid rgba(224,184,103,.65);background:rgba(13,9,5,.76);font-size:8px;letter-spacing:.07em;white-space:nowrap;pointer-events:none}.actor-label.selected{background:rgba(105,71,29,.92);border-color:#f0cb7d}
.topbar{position:fixed;z-index:20;top:max(7px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:8px;pointer-events:none}.badge,.status{padding:6px 9px;border:1px solid rgba(224,184,103,.38);background:rgba(13,9,5,.67);backdrop-filter:blur(10px);border-radius:9px;font-size:9px;letter-spacing:.09em;pointer-events:auto}.status{text-align:right}
#editor{position:fixed;z-index:30;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));padding:8px;border:1px solid rgba(224,184,103,.5);background:rgba(13,9,5,.86);backdrop-filter:blur(14px);border-radius:14px}.row{display:flex;align-items:center;gap:7px;margin-bottom:7px}.row:last-child{margin-bottom:0}
#spotName{min-width:0;flex:1;height:31px;border:1px solid rgba(224,184,103,.42);border-radius:8px;background:rgba(36,25,14,.95);color:#f5e5bf;padding:0 9px;text-transform:uppercase;font-size:11px;letter-spacing:.07em}.btn{height:31px;border:1px solid rgba(224,184,103,.52);border-radius:8px;background:rgba(38,27,15,.96);color:#f2dfb1;padding:0 10px;font-size:9px;letter-spacing:.07em;white-space:nowrap}.btn:active{transform:scale(.97)}.btn.primary{border-color:#e0b867;background:rgba(93,64,29,.96)}.btn.danger{border-color:rgba(191,116,88,.65)}
.control{display:grid;grid-template-columns:18px 1fr 43px 26px 26px;align-items:center;gap:5px;flex:1;min-width:0}.control label{font-size:9px;letter-spacing:.08em}.control output{font-size:9px;text-align:right;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#d6aa58}.nudge{height:27px;padding:0;border:1px solid rgba(224,184,103,.38);border-radius:7px;background:rgba(40,28,16,.94);color:#f2dfb1;font-size:14px}
#uiToggle{position:fixed;z-index:90;right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));height:29px;border:1px solid rgba(224,184,103,.52);border-radius:9px;background:rgba(13,9,5,.82);backdrop-filter:blur(10px);color:#f2dfb1;padding:0 9px;font:8px Georgia,serif;letter-spacing:.08em}body.ui-hidden #editor,body.ui-hidden .topbar{display:none}body:not(.ui-hidden) #uiToggle{bottom:calc(max(7px,env(safe-area-inset-bottom)) + 118px)}
#toast{position:fixed;z-index:60;left:50%;top:18%;transform:translate(-50%,-50%);opacity:0;transition:opacity .18s;padding:8px 12px;border:1px solid rgba(224,184,103,.55);background:rgba(13,9,5,.9);border-radius:10px;font-size:10px;letter-spacing:.08em;pointer-events:none}#toast.show{opacity:1}
@media(max-width:760px){body:not(.ui-hidden) #uiToggle{bottom:calc(max(7px,env(safe-area-inset-bottom)) + 105px)}.badge,.status{font-size:7px;padding:5px 7px}#editor{padding:7px}.row{gap:5px;margin-bottom:5px}.btn{height:28px;padding:0 7px;font-size:8px}#spotName{height:28px;font-size:9px}.control{grid-template-columns:14px 1fr 36px 23px 23px;gap:3px}.control label,.control output{font-size:8px}.nudge{height:24px}}
@media(orientation:portrait){#scene:after{content:"ROTATE FOR SCENE STAGE";position:absolute;inset:0;display:grid;place-items:center;background:#090704;color:#d8b46c;font-size:12px;letter-spacing:.18em;z-index:80}#editor,.topbar,#uiToggle{visibility:hidden}}

/* v0.5: reusable multi-scene workspace. */
#uiToggle{position:static;height:31px;border:1px solid rgba(224,184,103,.52);border-radius:8px;background:rgba(38,27,15,.96);color:#f2dfb1;padding:0 10px;font:9px Georgia,serif;letter-spacing:.07em;white-space:nowrap}
body.ui-hidden #uiToggle{display:block;position:fixed;z-index:90;right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));height:29px;background:rgba(13,9,5,.82);backdrop-filter:blur(10px);font:8px Georgia,serif}
</style></head><body>
<div id="scene"><div class="vignette"></div></div>
<div class="topbar"><div class="badge">OVA-D LAB · SCENE LIBRARY · v0.5.3</div><div class="status" id="status"></div></div>
<div id="editor">
<div class="row"><select id="sceneSelect" class="btn primary" style="flex:1;min-width:150px"></select><button class="btn" id="newScene">+ SCENE</button><button class="btn" id="copyScene">COPY SCENE</button><button class="btn" id="exportProject">EXPORT PROJECT</button><button class="btn" id="importProject">IMPORT</button></div>
<div class="row"><input id="spotName"><button class="btn primary" id="add">+ SPOT</button><button class="btn" id="duplicate">DUPLICATE</button><button class="btn danger" id="remove">DELETE</button></div>
<div class="row"><select id="spotType" class="btn" style="flex:1"><option value="unset">TYPE: UNSET</option><option value="idle">TYPE: IDLE</option><option value="waypoint">TYPE: WAYPOINT</option><option value="transfer">TYPE: TRANSFER</option><option value="activity">TYPE: ACTIVITY</option></select></div>
<div class="row">
<div class="control"><label>X</label><input id="x" type="range" min="-25" max="125" step=".1"><output id="xo"></output><button class="nudge" data-nudge="x,-.5">−</button><button class="nudge" data-nudge="x,.5">+</button></div>
<div class="control"><label>Y</label><input id="y" type="range" min="0" max="150" step=".1"><output id="yo"></output><button class="nudge" data-nudge="y,-.5">−</button><button class="nudge" data-nudge="y,.5">+</button></div>
<div class="control"><label>S</label><input id="scale" type="range" min="20" max="150" step=".5"><output id="so"></output><button class="nudge" data-nudge="scale,-1">−</button><button class="nudge" data-nudge="scale,1">+</button></div>
</div>
<div class="row"><button class="btn primary" id="save">SAVE PROJECT</button><button class="btn" id="copy">COPY SPOTS</button><button class="btn" id="labels">LABELS: ON</button><button class="btn" id="reset">RESET SCENE</button><button class="btn" id="uiToggle">HIDE UI</button></div>
</div><div id="toast"></div>
<div id="importBox" style="display:none;position:fixed;z-index:120;inset:0;background:rgba(0,0,0,.76);place-items:center"><div style="width:min(92vw,720px);padding:12px;border:1px solid rgba(224,184,103,.55);border-radius:14px;background:#160f09"><div style="font-size:10px;letter-spacing:.1em;margin-bottom:8px">IMPORT SCENE / PROJECT JSON</div><textarea id="importText" style="box-sizing:border-box;width:100%;height:150px;background:#0d0905;color:#f2dfb1;border:1px solid rgba(224,184,103,.4);border-radius:8px;padding:8px;font:10px monospace;user-select:text;-webkit-user-select:text;touch-action:auto" placeholder="Paste exported JSON here"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" id="doImport">IMPORT</button><button class="btn" id="cancelImport">CANCEL</button></div></div></div>
<script>
const KEY='ovad_scene_project_v05',OLD_KEY='ovad_scene_stage_semantic_v04',OLDER_KEY='ovad_scene_stage_v02';
const scene=document.querySelector('#scene'),status=document.querySelector('#status'),nameInput=document.querySelector('#spotName'),xEl=document.querySelector('#x'),yEl=document.querySelector('#y'),sEl=document.querySelector('#scale'),xo=document.querySelector('#xo'),yo=document.querySelector('#yo'),so=document.querySelector('#so'),toastEl=document.querySelector('#toast'),typeEl=document.querySelector('#spotType');
const DEFAULTS=[
{id:'spot_01',name:'SPOT_01',type:'unset',x:26.44,y:66.55,scale:25},{id:'spot_02',name:'SPOT_02',type:'unset',x:35.4,y:67.74,scale:27},{id:'spot_03',name:'SPOT_03',type:'unset',x:45.52,y:80.7,scale:42},{id:'spot_04',name:'SPOT_04',type:'unset',x:94.47,y:95.82,scale:66},{id:'spot_05',name:'SPOT_05',type:'unset',x:31.1,y:72.87,scale:35},{id:'spot_06',name:'SPOT_06',type:'unset',x:54.33,y:68.5,scale:23},{id:'spot_07',name:'SPOT_07',type:'unset',x:23.86,y:103.14,scale:73},{id:'spot_08',name:'SPOT_08',type:'unset',x:48.38,y:117.5,scale:95},{id:'spot_09',name:'SPOT_09',type:'unset',x:76.3,y:70.34,scale:24.5}];
const NEUTRAL=()=>({id:'spot_01',name:'UNNAMED',type:'unset',x:50,y:75,scale:45});
let project={version:'OVA-D_SCENE_PROJECT_0.5',activeScene:'BERKLITH_TAVERN',scenes:{}},state=null,drag=null,toastTimer;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1200)}
function norm(s){let {transition,destination,...clean}=s||{};return {...clean,type:clean.type||'unset'}}
function sceneData(id='BERKLITH_TAVERN',spots=DEFAULTS,bg='assets/berklith-tavern.jpg'){return {id,background:bg,spots:spots.map(x=>norm({...x})),selected:spots[0]?.id||'spot_01',labels:true}}
function loadProject(){try{let p=JSON.parse(localStorage.getItem(KEY));if(p?.scenes&&Object.keys(p.scenes).length){project=p;return}}catch(e){} let old=null;for(const k of [OLD_KEY,OLDER_KEY]){try{let v=JSON.parse(localStorage.getItem(k));if(v?.spots?.length){old=v;break}}catch(e){}} let s=old?sceneData(old.scene||'BERKLITH_TAVERN',old.spots,'assets/berklith-tavern.jpg'):sceneData();if(old?.selected)s.selected=old.selected;if(old?.labels===false)s.labels=false;project.scenes[s.id]=s;project.activeScene=s.id;persist()}
function persist(){if(state){project.scenes[state.id]=JSON.parse(JSON.stringify(state));project.activeScene=state.id}localStorage.setItem(KEY,JSON.stringify(project))}
function activate(id){let s=project.scenes[id];if(!s)return;state=JSON.parse(JSON.stringify(s));state.spots=(state.spots||[]).map(norm);if(!state.spots.length)state.spots=[NEUTRAL()];if(!state.spots.some(x=>x.id===state.selected))state.selected=state.spots[0].id;scene.style.backgroundImage=`url('${state.background||''}')`;refreshScenes();render()}
function refreshScenes(){let e=document.querySelector('#sceneSelect');e.innerHTML='';Object.keys(project.scenes).sort().forEach(id=>{let o=document.createElement('option');o.value=id;o.textContent=id;e.appendChild(o)});e.value=state?.id||project.activeScene}
function sel(){return state.spots.find(s=>s.id===state.selected)||state.spots[0]}
function safeId(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'_'+Date.now()}
function uniqueName(b){let n=b.toUpperCase(),i=2;while(state.spots.some(s=>s.name===n))n=b.toUpperCase()+'_'+i++;return n}
function save(silent=false){persist();if(!silent)toast('PROJECT SAVED')}
function outputs(){xo.value=(+xEl.value).toFixed(1);yo.value=(+yEl.value).toFixed(1);so.value=(+sEl.value).toFixed(1)}
function render(){scene.querySelectorAll('.actor,.actor-label').forEach(e=>e.remove());state.spots.forEach(s=>{let a=document.createElement('img');a.src='assets/test-character-01.png';a.className='actor'+(s.id===state.selected?' selected':'');a.dataset.id=s.id;a.style.left=s.x+'%';a.style.top=s.y+'%';a.style.height=s.scale+'vh';a.style.width='auto';scene.appendChild(a);let l=document.createElement('div');l.className='actor-label'+(s.id===state.selected?' selected':'');l.dataset.label=s.id;l.textContent=s.id.toUpperCase()+' · '+s.name+' · '+(s.type||'unset').toUpperCase();l.style.left=s.x+'%';l.style.top=Math.max(4,s.y-s.scale*.96)+'%';l.style.display=state.labels?'block':'none';scene.appendChild(l);a.addEventListener('pointerdown',startDrag)});let s=sel();nameInput.value=s.name;typeEl.value=s.type||'unset';xEl.value=s.x;yEl.value=s.y;sEl.value=s.scale;outputs();status.textContent=state.id+' · '+state.spots.length+' SPOTS · '+s.name;document.querySelector('#labels').textContent='LABELS: '+(state.labels?'ON':'OFF')}
function update(){let s=sel();s.x=+xEl.value;s.y=+yEl.value;s.scale=+sEl.value;save(true);render()}[xEl,yEl,sEl].forEach(e=>e.addEventListener('input',update));
nameInput.addEventListener('change',()=>{let s=sel(),n=(nameInput.value||s.name).trim().toUpperCase().replace(/\s+/g,'_');if(state.spots.some(q=>q.id!==s.id&&q.name===n))n=uniqueName(n);s.name=n;save(true);render()});typeEl.addEventListener('change',()=>{sel().type=typeEl.value;save(true);render()});
function startDrag(e){e.preventDefault();state.selected=e.currentTarget.dataset.id;const s=sel(),r=scene.getBoundingClientRect();drag={id:state.selected,offsetX:e.clientX-(r.left+s.x/100*r.width),offsetY:e.clientY-(r.top+s.y/100*r.height)};e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.addEventListener('pointermove',moveDrag);e.currentTarget.addEventListener('pointerup',endDrag,{once:true});e.currentTarget.addEventListener('pointercancel',endDrag,{once:true})}
function moveDrag(e){if(!drag)return;let r=scene.getBoundingClientRect(),s=sel(),ax=e.clientX-drag.offsetX,ay=e.clientY-drag.offsetY;s.x=Math.max(-25,Math.min(125,(ax-r.left)/r.width*100));s.y=Math.max(0,Math.min(150,(ay-r.top)/r.height*100));e.currentTarget.style.left=s.x+'%';e.currentTarget.style.top=s.y+'%';let l=scene.querySelector('.actor-label[data-label="'+s.id+'"]');if(l){l.style.left=s.x+'%';l.style.top=Math.max(4,s.y-s.scale*.96)+'%'}xEl.value=s.x;yEl.value=s.y;outputs()}
function endDrag(){drag=null;save(true);render()}
document.querySelector('#add').onclick=()=>{let next=1;while(state.spots.some(s=>s.name==='SPOT_'+String(next).padStart(2,'0')))next++;let nm='SPOT_'+String(next).padStart(2,'0'),q={id:safeId(nm),name:nm,type:'unset',x:50,y:75,scale:45};state.spots.push(q);state.selected=q.id;save(true);render();toast('SPOT ADDED')};
document.querySelector('#duplicate').onclick=()=>{let s=sel(),q={...s,id:safeId(s.name),name:uniqueName(s.name),x:Math.min(125,s.x+3),y:Math.min(150,s.y+2)};state.spots.push(q);state.selected=q.id;save(true);render();toast('DUPLICATED')};
document.querySelector('#remove').onclick=()=>{if(state.spots.length<=1)return toast('KEEP ONE SPOT');let i=state.spots.findIndex(s=>s.id===state.selected);state.spots.splice(i,1);state.selected=state.spots[Math.max(0,i-1)].id;save(true);render();toast('SPOT DELETED')};
document.querySelector('#save').onclick=()=>save();document.querySelector('#labels').onclick=()=>{state.labels=!state.labels;save(true);render()};
document.querySelector('#reset').onclick=()=>{if(confirm('Reset current scene spots? Other scenes are untouched.')){state.spots=[NEUTRAL()];state.selected='spot_01';save(true);render();toast('SCENE RESET')}};
document.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>{let [k,d]=b.dataset.nudge.split(','),s=sel();s[k]=+(s[k]+(+d)).toFixed(2);save(true);render()});
function copyText(t,msg){navigator.clipboard?.writeText(t).then(()=>toast(msg)).catch(()=>{let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast(msg)})}
document.querySelector('#copy').onclick=()=>{let ex={version:'OVA-D_SCENE_STAGE_0.5',scene:state.id,spots:{}};state.spots.forEach(s=>ex.spots[s.id]={name:s.name,type:s.type,x:+s.x.toFixed(2),y:+s.y.toFixed(2),scale:+s.scale.toFixed(2)});copyText(JSON.stringify(ex,null,2),'SPOTS COPIED')};
document.querySelector('#sceneSelect').onchange=e=>{persist();activate(e.target.value)};
document.querySelector('#newScene').onclick=()=>{let id=prompt('New scene ID (example: RIONNES_ROOM)');if(!id)return;id=id.trim().toUpperCase().replace(/\s+/g,'_').replace(/[^A-Z0-9_-]/g,'');if(!id)return;if(project.scenes[id])return toast('SCENE EXISTS');let bg=prompt('Background asset path','assets/rionnes-room.jpg');if(bg===null)return;persist();project.scenes[id]=sceneData(id,[NEUTRAL()],bg.trim());project.activeScene=id;localStorage.setItem(KEY,JSON.stringify(project));activate(id);toast('SCENE CREATED')};
document.querySelector('#copyScene').onclick=()=>{persist();copyText(JSON.stringify({version:'OVA-D_SCENE_0.5',scene:project.scenes[state.id]},null,2),'SCENE COPIED')};
document.querySelector('#exportProject').onclick=()=>{persist();copyText(JSON.stringify(project,null,2),'PROJECT COPIED')};
const ib=document.querySelector('#importBox'),it=document.querySelector('#importText');document.querySelector('#importProject').onclick=()=>{it.value='';ib.style.display='grid';it.focus()};document.querySelector('#cancelImport').onclick=()=>ib.style.display='none';
document.querySelector('#doImport').onclick=()=>{try{let d=JSON.parse(it.value);persist();if(d.version==='OVA-D_SCENE_0.5'&&d.scene?.id){project.scenes[d.scene.id]=d.scene;project.activeScene=d.scene.id}else if(d.scenes&&Object.keys(d.scenes).length){project=d}else if(d.scene&&d.spots){let spots=Object.entries(d.spots).map(([id,v])=>norm({id,...v}));project.scenes[d.scene]=sceneData(d.scene,spots,'');project.activeScene=d.scene}else throw 0;localStorage.setItem(KEY,JSON.stringify(project));ib.style.display='none';activate(project.activeScene);toast('IMPORT COMPLETE')}catch(e){toast('INVALID JSON')}};
const uiToggle=document.querySelector('#uiToggle');uiToggle.onclick=()=>{let hiding=!document.body.classList.contains('ui-hidden');if(hiding){document.body.appendChild(uiToggle);document.body.classList.add('ui-hidden');uiToggle.textContent='SHOW UI'}else{document.body.classList.remove('ui-hidden');document.querySelector('#editor .row:last-child').appendChild(uiToggle);uiToggle.textContent='HIDE UI'}};
loadProject();activate(project.activeScene);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
