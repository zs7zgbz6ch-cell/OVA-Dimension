<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090704;color:#f2dfb1;font-family:Georgia,serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{position:fixed;inset:0}
#scene{position:fixed;inset:-2px;background:url('assets/berklith-tavern.jpg') center/cover no-repeat;overflow:hidden}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 57%,rgba(0,0,0,.28) 100%)}
.actor{position:absolute;width:auto;transform:translate(-50%,-100%);transform-origin:50% 100%;filter:drop-shadow(0 9px 7px rgba(0,0,0,.24));touch-action:none}.actor.selected{filter:drop-shadow(0 0 4px rgba(255,220,132,.95)) drop-shadow(0 10px 7px rgba(0,0,0,.28))}
.actor-label{position:absolute;z-index:7;transform:translate(-50%,-50%);padding:3px 6px;border-radius:7px;border:1px solid rgba(224,184,103,.65);background:rgba(13,9,5,.76);font-size:8px;letter-spacing:.07em;white-space:nowrap;pointer-events:none}.actor-label.selected{background:rgba(105,71,29,.92);border-color:#f0cb7d}
.topbar{position:fixed;z-index:20;top:max(7px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:8px;pointer-events:none}.badge,.status{padding:6px 9px;border:1px solid rgba(224,184,103,.38);background:rgba(13,9,5,.67);backdrop-filter:blur(10px);border-radius:9px;font-size:9px;letter-spacing:.09em;pointer-events:auto}.status{text-align:right}
#editor{position:fixed;z-index:30;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));padding:8px;border:1px solid rgba(224,184,103,.5);background:rgba(13,9,5,.86);backdrop-filter:blur(14px);border-radius:14px}.row{display:flex;align-items:center;gap:7px;margin-bottom:7px}.row:last-child{margin-bottom:0}
.conn-select{width:100%;height:31px;border:1px solid rgba(224,184,103,.42);border-radius:8px;background:rgba(36,25,14,.95);color:#f5e5bf;padding:0 7px;font-size:9px;letter-spacing:.04em}.btn{height:31px;border:1px solid rgba(224,184,103,.52);border-radius:8px;background:rgba(38,27,15,.96);color:#f2dfb1;padding:0 10px;font-size:9px;letter-spacing:.07em;white-space:nowrap}.btn:active{transform:scale(.97)}.btn.primary{border-color:#e0b867;background:rgba(93,64,29,.96)}.btn.danger{border-color:rgba(191,116,88,.65)}
.control{display:grid;grid-template-columns:18px 1fr 43px 26px 26px;align-items:center;gap:5px;flex:1;min-width:0}.control label{font-size:9px;letter-spacing:.08em}.control output{font-size:9px;text-align:right;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#d6aa58}.nudge{height:27px;padding:0;border:1px solid rgba(224,184,103,.38);border-radius:7px;background:rgba(40,28,16,.94);color:#f2dfb1;font-size:14px}
#uiToggle{position:fixed;z-index:90;right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));height:29px;border:1px solid rgba(224,184,103,.52);border-radius:9px;background:rgba(13,9,5,.82);backdrop-filter:blur(10px);color:#f2dfb1;padding:0 9px;font:8px Georgia,serif;letter-spacing:.08em}body.ui-hidden #editor,body.ui-hidden .topbar{display:none}body:not(.ui-hidden) #uiToggle{bottom:calc(max(7px,env(safe-area-inset-bottom)) + 118px)}
#toast{position:fixed;z-index:60;left:50%;top:18%;transform:translate(-50%,-50%);opacity:0;transition:opacity .18s;padding:8px 12px;border:1px solid rgba(224,184,103,.55);background:rgba(13,9,5,.9);border-radius:10px;font-size:10px;letter-spacing:.08em;pointer-events:none}#toast.show{opacity:1}
@media(max-width:760px){body:not(.ui-hidden) #uiToggle{bottom:calc(max(7px,env(safe-area-inset-bottom)) + 105px)}.badge,.status{font-size:7px;padding:5px 7px}#editor{padding:7px}.row{gap:5px;margin-bottom:5px}.btn{height:28px;padding:0 7px;font-size:8px}.conn-select{height:28px;font-size:8px}.control{grid-template-columns:14px 1fr 36px 23px 23px;gap:3px}.control label,.control output{font-size:8px}.nudge{height:24px}}
@media(orientation:portrait){#scene:after{content:"ROTATE FOR SCENE STAGE";position:absolute;inset:0;display:grid;place-items:center;background:#090704;color:#d8b46c;font-size:12px;letter-spacing:.18em;z-index:80}#editor,.topbar,#uiToggle{visibility:hidden}}

/* v0.5: reusable multi-scene workspace. */
#uiToggle{position:static;height:31px;border:1px solid rgba(224,184,103,.52);border-radius:8px;background:rgba(38,27,15,.96);color:#f2dfb1;padding:0 10px;font:9px Georgia,serif;letter-spacing:.07em;white-space:nowrap}
body.ui-hidden #uiToggle{display:block;position:fixed;z-index:90;right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));height:29px;background:rgba(13,9,5,.82);backdrop-filter:blur(10px);font:8px Georgia,serif}

/* v0.6 compact authoring UI */
#editor{left:max(8px,env(safe-area-inset-left));right:max(92px,calc(env(safe-area-inset-right) + 84px));bottom:max(7px,env(safe-area-inset-bottom));padding:6px 7px;background:rgba(13,9,5,.72);border-radius:12px;backdrop-filter:blur(12px)}
.compact-head{display:flex;align-items:center;gap:6px;margin-bottom:5px}.compact-head #sceneSelect{min-width:140px;max-width:235px;flex:0 1 235px}.compact-head #spotSummary{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:8px;letter-spacing:.08em;color:#f2dfb1}.compact-head #more{font-size:16px;width:38px;padding:0}
.controls-row{margin:0}.control{grid-template-columns:13px minmax(55px,1fr) 35px 23px 23px;gap:3px}.control label,.control output{font-size:8px}.nudge{height:24px}
#uiToggle{display:block!important;position:fixed!important;z-index:90;right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));height:31px;background:rgba(13,9,5,.82);backdrop-filter:blur(10px)}
body:not(.ui-hidden) #uiToggle{bottom:max(7px,env(safe-area-inset-bottom))}body.ui-hidden #uiToggle{bottom:max(7px,env(safe-area-inset-bottom))}
#toolsPanel{display:none;position:fixed;z-index:55;right:max(8px,env(safe-area-inset-right));bottom:48px;width:min(410px,92vw);padding:9px;border:1px solid rgba(224,184,103,.55);border-radius:13px;background:rgba(13,9,5,.94);backdrop-filter:blur(16px)}#toolsPanel.open{display:block}.tools-title{display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.1em;margin-bottom:7px}.tools-section{padding-top:7px;margin-top:7px;border-top:1px solid rgba(224,184,103,.2)}.tools-label{font-size:7px;letter-spacing:.13em;opacity:.72;margin-bottom:5px}.tools-section #spotType,.tools-section .conn-select{width:100%;margin-bottom:6px}.tools-actions{display:flex;gap:5px;flex-wrap:wrap}.tools-actions .btn{flex:1;min-width:max-content}
body.ui-hidden #toolsPanel{display:none}.topbar{z-index:20}
@media(max-width:760px){#editor{right:max(82px,calc(env(safe-area-inset-right) + 74px));padding:5px 6px}.compact-head{margin-bottom:4px}.compact-head #sceneSelect{min-width:115px;max-width:185px}.control{grid-template-columns:11px minmax(42px,1fr) 31px 21px 21px}.nudge{height:22px}.controls-row{gap:4px}#toolsPanel{bottom:45px;width:min(390px,94vw)}}
</style></head><body>
<div id="scene"><div class="vignette"></div></div>
<div class="topbar"><div class="badge">OVA-D LAB · WORLD STAGE · v0.7</div><div class="status" id="status"></div></div>
<div id="editor">
<div class="compact-head"><select id="sceneSelect" class="btn primary"></select><div id="spotSummary"></div><button class="btn" id="more">⋯</button></div>
<div class="row controls-row">
<div class="control"><label>X</label><input id="x" type="range" min="-25" max="125" step=".1"><output id="xo"></output><button class="nudge" data-nudge="x,-.5">−</button><button class="nudge" data-nudge="x,.5">+</button></div>
<div class="control"><label>Y</label><input id="y" type="range" min="0" max="150" step=".1"><output id="yo"></output><button class="nudge" data-nudge="y,-.5">−</button><button class="nudge" data-nudge="y,.5">+</button></div>
<div class="control"><label>S</label><input id="scale" type="range" min="20" max="150" step=".5"><output id="so"></output><button class="nudge" data-nudge="scale,-1">−</button><button class="nudge" data-nudge="scale,1">+</button></div>
</div>
</div>
<button class="btn" id="uiToggle">HIDE UI</button>
<div id="toolsPanel">
<div class="tools-title"><span>SCENE / SPOT TOOLS</span><button class="btn" id="closeTools">CLOSE</button></div>
<div class="tools-section"><div class="tools-label">SPOT</div><select id="spotType" class="btn"><option value="unset">TYPE: UNSET</option><option value="idle">TYPE: IDLE</option><option value="waypoint">TYPE: WAYPOINT</option><option value="transfer">TYPE: TRANSFER</option><option value="activity">TYPE: ACTIVITY</option></select><div class="tools-actions"><button class="btn primary" id="add">+ SPOT</button><button class="btn" id="duplicate">DUPLICATE</button><button class="btn danger" id="remove">DELETE</button></div></div><div class="tools-section"><div class="tools-label">CONNECTION FROM SELECTED SPOT</div><select id="connectScene" class="conn-select"></select><select id="connectSpot" class="conn-select"></select><div class="tools-actions"><button class="btn primary" id="addConnection">CONNECT</button><button class="btn danger" id="removeConnection">REMOVE SELECTED</button></div><select id="connectionList" class="conn-select" size="3"></select></div>
<div class="tools-section"><div class="tools-label">SCENE</div><div class="tools-actions"><button class="btn" id="newScene">+ SCENE</button><button class="btn" id="labels">LABELS: ON</button><button class="btn danger" id="reset">RESET SCENE</button></div></div>
<div class="tools-section"><div class="tools-label">PROJECT</div><div class="tools-actions"><button class="btn primary" id="save">SAVE PROJECT</button><button class="btn" id="copy">COPY SPOTS</button><button class="btn" id="copyScene">COPY SCENE</button><button class="btn" id="exportProject">EXPORT PROJECT</button><button class="btn" id="importProject">IMPORT</button></div></div>
</div><div id="toast"></div>
<div id="importBox" style="display:none;position:fixed;z-index:120;inset:0;background:rgba(0,0,0,.76);place-items:center"><div style="width:min(92vw,720px);padding:12px;border:1px solid rgba(224,184,103,.55);border-radius:14px;background:#160f09"><div style="font-size:10px;letter-spacing:.1em;margin-bottom:8px">IMPORT SCENE / PROJECT JSON</div><textarea id="importText" style="box-sizing:border-box;width:100%;height:150px;background:#0d0905;color:#f2dfb1;border:1px solid rgba(224,184,103,.4);border-radius:8px;padding:8px;font:10px monospace;user-select:text;-webkit-user-select:text;touch-action:auto" placeholder="Paste exported JSON here"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" id="doImport">IMPORT</button><button class="btn" id="cancelImport">CANCEL</button></div></div></div>
<script>
const KEY='ovad_world_stage_v07',PREV_KEY='ovad_scene_project_v05',OLD_KEY='ovad_scene_stage_semantic_v04',OLDER_KEY='ovad_scene_stage_v02';
const scene=document.querySelector('#scene'),status=document.querySelector('#status'),xEl=document.querySelector('#x'),yEl=document.querySelector('#y'),sEl=document.querySelector('#scale'),xo=document.querySelector('#xo'),yo=document.querySelector('#yo'),so=document.querySelector('#so'),toastEl=document.querySelector('#toast'),typeEl=document.querySelector('#spotType'),spotSummary=document.querySelector('#spotSummary');
const DEFAULTS=[
{id:'SPOT_01',type:'unset',x:26.44,y:66.55,scale:25},{id:'SPOT_02',type:'unset',x:35.4,y:67.74,scale:27},{id:'SPOT_03',type:'unset',x:45.52,y:80.7,scale:42},{id:'SPOT_04',type:'unset',x:94.47,y:95.82,scale:66},{id:'SPOT_05',type:'unset',x:31.1,y:72.87,scale:35},{id:'SPOT_06',type:'unset',x:54.33,y:68.5,scale:23},{id:'SPOT_07',type:'unset',x:23.86,y:103.14,scale:73},{id:'SPOT_08',type:'unset',x:48.38,y:117.5,scale:95},{id:'SPOT_09',type:'unset',x:76.3,y:70.34,scale:24.5}];
const NEUTRAL=()=>({id:'SPOT_01',type:'unset',x:50,y:75,scale:45});
let project={version:'OVA-D_WORLD_STAGE_0.7',activeScene:'BERKLITH_TAVERN',scenes:{},connections:[]},state=null,drag=null,toastTimer;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1200)}
function canonicalSpotId(s,i){let raw=String(s?.id||s?.name||'').toUpperCase();let m=raw.match(/SPOT[_-]?(\d+)/);return m?'SPOT_'+String(+m[1]).padStart(2,'0'):'SPOT_'+String(i+1).padStart(2,'0')}
function norm(s,i=0){let {transition,destination,name,...clean}=s||{};return {id:canonicalSpotId(s,i),type:clean.type||'unset',x:+clean.x||0,y:+clean.y||0,scale:+clean.scale||45}}
function normalizeScene(raw,idHint){let id=(raw?.id||idHint||'SCENE').toUpperCase();let spots=(raw?.spots||[]);if(!Array.isArray(spots))spots=Object.entries(spots).map(([id,v])=>({id,...v}));spots=spots.map(norm);if(!spots.length)spots=[NEUTRAL()];let selected=canonicalSpotId({id:raw?.selected||spots[0].id},0);if(!spots.some(x=>x.id===selected))selected=spots[0].id;return {id,background:raw?.background||'',spots,selected,labels:raw?.labels!==false}}
function sceneData(id='BERKLITH_TAVERN',spots=DEFAULTS,bg='assets/berklith-tavern.jpg'){return normalizeScene({id,background:bg,spots,selected:spots[0]?.id||'SPOT_01',labels:true},id)}
function migrateProject(p){let out={version:'OVA-D_WORLD_STAGE_0.7',activeScene:p?.activeScene||'BERKLITH_TAVERN',scenes:{},connections:[]};if(p?.scenes)Object.entries(p.scenes).forEach(([id,sc])=>out.scenes[id]=normalizeScene(sc,id));if(Array.isArray(p?.connections))out.connections=p.connections.filter(c=>c?.a?.scene&&c?.a?.spot&&c?.b?.scene&&c?.b?.spot).map(c=>({a:{scene:String(c.a.scene).toUpperCase(),spot:canonicalSpotId({id:c.a.spot},0)},b:{scene:String(c.b.scene).toUpperCase(),spot:canonicalSpotId({id:c.b.spot},0)}}));if(!out.scenes[out.activeScene])out.activeScene=Object.keys(out.scenes)[0]||'BERKLITH_TAVERN';return out}
function loadProject(){for(const k of [KEY,PREV_KEY]){try{let p=JSON.parse(localStorage.getItem(k));if(p?.scenes&&Object.keys(p.scenes).length){project=migrateProject(p);persist();return}}catch(e){}} let old=null;for(const k of [OLD_KEY,OLDER_KEY]){try{let v=JSON.parse(localStorage.getItem(k));if(v?.spots?.length){old=v;break}}catch(e){}} let sc=old?sceneData(old.scene||'BERKLITH_TAVERN',old.spots,'assets/berklith-tavern.jpg'):sceneData();project.scenes[sc.id]=sc;project.activeScene=sc.id;persist()}
function persist(){project.version='OVA-D_WORLD_STAGE_0.7';project.connections=project.connections||[];if(state){project.scenes[state.id]=JSON.parse(JSON.stringify(state));project.activeScene=state.id}localStorage.setItem(KEY,JSON.stringify(project))}
function activate(id){let s=project.scenes[id];if(!s)return;state=JSON.parse(JSON.stringify(s));state.spots=(state.spots||[]).map((x,i)=>norm(x,i));if(!state.spots.length)state.spots=[NEUTRAL()];if(!state.spots.some(x=>x.id===state.selected))state.selected=state.spots[0].id;scene.style.backgroundImage=`url('${state.background||''}')`;refreshScenes();render()}
function refreshScenes(){let e=document.querySelector('#sceneSelect');e.innerHTML='';Object.keys(project.scenes).sort().forEach(id=>{let o=document.createElement('option');o.value=id;o.textContent=id;e.appendChild(o)});e.value=state?.id||project.activeScene}
function sel(){return state.spots.find(s=>s.id===state.selected)||state.spots[0]}
function nextSpotId(){let n=1;while(state.spots.some(s=>s.id==='SPOT_'+String(n).padStart(2,'0')))n++;return 'SPOT_'+String(n).padStart(2,'0')}
function save(silent=false){persist();if(!silent)toast('PROJECT SAVED')}
function outputs(){xo.value=(+xEl.value).toFixed(1);yo.value=(+yEl.value).toFixed(1);so.value=(+sEl.value).toFixed(1)}
function render(){scene.querySelectorAll('.actor,.actor-label').forEach(e=>e.remove());state.spots.forEach(s=>{let a=document.createElement('img');a.src='assets/test-character-01.png';a.className='actor'+(s.id===state.selected?' selected':'');a.dataset.id=s.id;a.style.left=s.x+'%';a.style.top=s.y+'%';a.style.height=s.scale+'vh';a.style.width='auto';scene.appendChild(a);let l=document.createElement('div');l.className='actor-label'+(s.id===state.selected?' selected':'');l.dataset.label=s.id;l.textContent=s.id+' · '+(s.type||'unset').toUpperCase();l.style.left=s.x+'%';l.style.top=Math.max(4,s.y-s.scale*.96)+'%';l.style.display=state.labels?'block':'none';scene.appendChild(l);a.addEventListener('pointerdown',startDrag)});let s=sel();typeEl.value=s.type||'unset';xEl.value=s.x;yEl.value=s.y;sEl.value=s.scale;outputs();status.textContent=state.id+' · '+state.spots.length+' SPOTS · '+s.id;spotSummary.textContent=s.id+' · '+(s.type||'unset').toUpperCase();refreshConnectionUI();document.querySelector('#labels').textContent='LABELS: '+(state.labels?'ON':'OFF')}
function update(){let s=sel();s.x=+xEl.value;s.y=+yEl.value;s.scale=+sEl.value;save(true);render()}[xEl,yEl,sEl].forEach(e=>e.addEventListener('input',update));
typeEl.addEventListener('change',()=>{sel().type=typeEl.value;save(true);render()});
function startDrag(e){e.preventDefault();state.selected=e.currentTarget.dataset.id;const s=sel(),r=scene.getBoundingClientRect();drag={id:state.selected,offsetX:e.clientX-(r.left+s.x/100*r.width),offsetY:e.clientY-(r.top+s.y/100*r.height)};e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.addEventListener('pointermove',moveDrag);e.currentTarget.addEventListener('pointerup',endDrag,{once:true});e.currentTarget.addEventListener('pointercancel',endDrag,{once:true})}
function moveDrag(e){if(!drag)return;let r=scene.getBoundingClientRect(),s=sel(),ax=e.clientX-drag.offsetX,ay=e.clientY-drag.offsetY;s.x=Math.max(-25,Math.min(125,(ax-r.left)/r.width*100));s.y=Math.max(0,Math.min(150,(ay-r.top)/r.height*100));e.currentTarget.style.left=s.x+'%';e.currentTarget.style.top=s.y+'%';let l=scene.querySelector('.actor-label[data-label="'+s.id+'"]');if(l){l.style.left=s.x+'%';l.style.top=Math.max(4,s.y-s.scale*.96)+'%'}xEl.value=s.x;yEl.value=s.y;outputs()}
function endDrag(){drag=null;save(true);render()}
document.querySelector('#add').onclick=()=>{let id=nextSpotId(),q={id,type:'unset',x:50,y:75,scale:45};state.spots.push(q);state.selected=q.id;save(true);render();toast('SPOT ADDED')};
document.querySelector('#duplicate').onclick=()=>{let src=sel(),id=nextSpotId(),q={...src,id,x:Math.min(125,src.x+3),y:Math.min(150,src.y+2)};state.spots.push(q);state.selected=id;save(true);render();toast('DUPLICATED')};
document.querySelector('#remove').onclick=()=>{if(state.spots.length<=1)return toast('KEEP ONE SPOT');let dead={scene:state.id,spot:state.selected};project.connections=(project.connections||[]).filter(c=>!sameEnd(c.a,dead)&&!sameEnd(c.b,dead));let i=state.spots.findIndex(s=>s.id===state.selected);state.spots.splice(i,1);state.selected=state.spots[Math.max(0,i-1)].id;save(true);render();toast('SPOT DELETED')};
document.querySelector('#save').onclick=()=>save();document.querySelector('#labels').onclick=()=>{state.labels=!state.labels;save(true);render()};
document.querySelector('#reset').onclick=()=>{if(confirm('Reset current scene spots? Other scenes are untouched.')){project.connections=(project.connections||[]).filter(c=>c.a.scene!==state.id&&c.b.scene!==state.id);state.spots=[NEUTRAL()];state.selected='SPOT_01';save(true);render();toast('SCENE RESET')}};
document.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>{let [k,d]=b.dataset.nudge.split(','),s=sel();s[k]=+(s[k]+(+d)).toFixed(2);save(true);render()});
function copyText(t,msg){navigator.clipboard?.writeText(t).then(()=>toast(msg)).catch(()=>{let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast(msg)})}
document.querySelector('#copy').onclick=()=>{let spots={};state.spots.forEach(s=>spots[s.id]={type:s.type,x:+s.x.toFixed(2),y:+s.y.toFixed(2),scale:+s.scale.toFixed(2)});let connections=(project.connections||[]).filter(c=>c.a.scene===state.id||c.b.scene===state.id);copyText(JSON.stringify({version:'OVA-D_WORLD_SCENE_0.7',scene:state.id,spots,connections},null,2),'SCENE DATA COPIED')};
document.querySelector('#sceneSelect').onchange=e=>{persist();activate(e.target.value)};
document.querySelector('#newScene').onclick=()=>{let id=prompt('New scene ID (example: RIONNES_ROOM)');if(!id)return;id=id.trim().toUpperCase().replace(/\s+/g,'_').replace(/[^A-Z0-9_-]/g,'');if(!id)return;if(project.scenes[id])return toast('SCENE EXISTS');let bg=prompt('Background asset path','assets/rionnes-room.jpg');if(bg===null)return;persist();project.scenes[id]=sceneData(id,[NEUTRAL()],bg.trim());project.activeScene=id;localStorage.setItem(KEY,JSON.stringify(project));activate(id);toast('SCENE CREATED')};
document.querySelector('#copyScene').onclick=()=>{persist();copyText(JSON.stringify({version:'OVA-D_WORLD_SCENE_0.7',scene:project.scenes[state.id],connections:(project.connections||[]).filter(c=>c.a.scene===state.id||c.b.scene===state.id)},null,2),'SCENE COPIED')};
document.querySelector('#exportProject').onclick=()=>{persist();copyText(JSON.stringify(project,null,2),'PROJECT COPIED')};
function sameEnd(a,b){return a?.scene===b?.scene&&a?.spot===b?.spot}
function sameConnection(c,a,b){return (sameEnd(c.a,a)&&sameEnd(c.b,b))||(sameEnd(c.a,b)&&sameEnd(c.b,a))}
function endpointLabel(e){return e.scene+' / '+e.spot}
function refreshConnectionUI(){let sceneSel=document.querySelector('#connectScene'),spotSel=document.querySelector('#connectSpot'),list=document.querySelector('#connectionList');if(!sceneSel||!state)return;let oldScene=sceneSel.value;sceneSel.innerHTML='';Object.keys(project.scenes).sort().forEach(id=>{let o=document.createElement('option');o.value=id;o.textContent=id;sceneSel.appendChild(o)});sceneSel.value=project.scenes[oldScene]?oldScene:state.id;let target=project.scenes[sceneSel.value];spotSel.innerHTML='';(target?.spots||[]).forEach(s=>{let o=document.createElement('option');o.value=s.id;o.textContent=s.id+' · '+(s.type||'unset').toUpperCase();spotSel.appendChild(o)});list.innerHTML='';let here={scene:state.id,spot:sel().id};(project.connections||[]).forEach((c,i)=>{if(sameEnd(c.a,here)||sameEnd(c.b,here)){let other=sameEnd(c.a,here)?c.b:c.a,o=document.createElement('option');o.value=i;o.textContent='↔ '+endpointLabel(other);list.appendChild(o)}})}
document.querySelector('#connectScene').onchange=refreshConnectionUI;
document.querySelector('#addConnection').onclick=()=>{let a={scene:state.id,spot:sel().id},b={scene:document.querySelector('#connectScene').value,spot:document.querySelector('#connectSpot').value};if(!b.scene||!b.spot)return toast('CHOOSE TARGET');if(sameEnd(a,b))return toast('SAME SPOT');if((project.connections||[]).some(c=>sameConnection(c,a,b)))return toast('ALREADY CONNECTED');project.connections=project.connections||[];project.connections.push({a,b});save(true);refreshConnectionUI();toast('CONNECTED')};
document.querySelector('#removeConnection').onclick=()=>{let list=document.querySelector('#connectionList'),i=+list.value;if(!Number.isInteger(i)||!project.connections?.[i])return toast('SELECT CONNECTION');project.connections.splice(i,1);save(true);refreshConnectionUI();toast('CONNECTION REMOVED')};
const ib=document.querySelector('#importBox'),it=document.querySelector('#importText');document.querySelector('#importProject').onclick=()=>{it.value='';ib.style.display='grid';it.focus()};document.querySelector('#cancelImport').onclick=()=>ib.style.display='none';
document.querySelector('#doImport').onclick=()=>{try{let d=JSON.parse(it.value);persist();if(d.version==='OVA-D_WORLD_SCENE_0.7'&&d.scene?.id){let sc=normalizeScene(d.scene,d.scene.id);project.scenes[sc.id]=sc;project.connections=[...(project.connections||[]).filter(c=>c.a.scene!==sc.id&&c.b.scene!==sc.id),...(d.connections||[])];project.activeScene=sc.id}else if(d.scenes&&Object.keys(d.scenes).length){project=migrateProject(d)}else if(d.scene&&d.spots){let spots=Object.entries(d.spots).map(([id,v],i)=>norm({id,...v},i));let sc=sceneData(d.scene,spots,'');project.scenes[sc.id]=sc;project.activeScene=sc.id}else throw 0;project=migrateProject(project);localStorage.setItem(KEY,JSON.stringify(project));ib.style.display='none';activate(project.activeScene);toast('IMPORT COMPLETE')}catch(e){toast('INVALID JSON')}};
const uiToggle=document.querySelector('#uiToggle'),toolsPanel=document.querySelector('#toolsPanel');document.querySelector('#more').onclick=()=>toolsPanel.classList.toggle('open');document.querySelector('#closeTools').onclick=()=>toolsPanel.classList.remove('open');uiToggle.onclick=()=>{let hiding=!document.body.classList.contains('ui-hidden');document.body.classList.toggle('ui-hidden',hiding);toolsPanel.classList.remove('open');uiToggle.textContent=hiding?'SHOW UI':'HIDE UI'};
loadProject();activate(project.activeScene);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
