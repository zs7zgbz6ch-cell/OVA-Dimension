<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OVA-D Landing Blockout v0.4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202226;color:#fff;font-family:-apple-system,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.panel{position:fixed;z-index:4;background:#111d;border-radius:11px;padding:9px 11px}
#info{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));font-size:12px;line-height:1.35}
#legend{left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));font-size:10px;line-height:1.35}
#buttons{position:fixed;z-index:5;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px}
button{padding:10px 11px;border:1px solid #ffffff55;border-radius:10px;background:#111e;color:white;font-weight:700}
</style></head>
<body><canvas id="c"></canvas>
<div id="info" class="panel"><b>OVA-D · Landing Blockout v0.4</b><br>Paper plan = source of truth ❤️<br>Drag: orbit · pinch: zoom</div>
<div id="legend" class="panel">Center = RECTANGULAR OPENING<br>Left = stairs DOWN · gold post = intended view corner</div>
<div id="buttons"><button id="topBtn">Top</button><button id="playerBtn">Player view</button><button id="orbitBtn">Orbit</button></div>
<script>
(()=> {
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let yaw=0,pitch=1.47,zoom=105,target={x:0,y:0,z:0};
const faces=[], lines=[];
const K={floor:'#a57b55',wall:'#d8cbb2',wood:'#5b3924',door:'#70462d',stone:'#888077',void:'#111214',stair:'#765039',window:'#587284',marker:'#d8ad4d'};
function quad(a,b,c,d,color){faces.push({p:[a,b,c,d],color})}
function box(x,y,z,w,h,d,color){
 let X=w/2,Y=h/2,Z=d/2,v=[[x-X,y-Y,z-Z],[x+X,y-Y,z-Z],[x+X,y+Y,z-Z],[x-X,y+Y,z-Z],[x-X,y-Y,z+Z],[x+X,y-Y,z+Z],[x+X,y+Y,z+Z],[x-X,y+Y,z+Z]];
 quad(v[4],v[5],v[6],v[7],color);quad(v[1],v[0],v[3],v[2],color);quad(v[0],v[4],v[7],v[3],color);quad(v[5],v[1],v[2],v[6],color);quad(v[3],v[7],v[6],v[2],color);quad(v[0],v[1],v[5],v[4],color)
}
function floor(x,z,w,d){box(x,-.1,z,w,.2,d,K.floor)}
// Paper plan: one rectangular tavern opening. Landing surrounds it.
const xL=-3.0,xR=3.0,zN=-2.55,zS=2.05;
floor(0,-3.35,10.2,1.6); floor(0,2.9,10.2,1.7); floor(-4.0,-.25,2.0,4.6); floor(4.0,-.25,2.0,4.6);
box(0,-2.6,-.25,6,.1,4.6,K.void);
// Outer walls.
box(0,1.5,-4.18,10.3,3,.22,K.wall); box(-5.12,1.5,-.25,.22,3,8.0,K.wall); box(5.12,1.5,-.25,.22,3,8.0,K.wall); box(0,1.5,3.82,10.3,3,.22,K.wall);
// Balcony/courtyard door opposite side.
box(0,1.05,-4.05,1.25,2.1,.10,K.door);
// Rionne side: Rionne -> chimney -> guest room.
box(5.00,1.05,-1.65,.10,2.1,1.05,K.door);
box(4.82,1.5,-.05,.62,3,.82,K.stone);
box(5.00,1.05,1.25,.10,2.1,1.05,K.door);
// Closed guest hallway on left side.
box(-5.00,1.05,-1.7,.10,2.1,1.35,K.door);
// Window on lower wall from sketch.
box(0,1.25,3.69,1.8,1.3,.08,K.window);
// Rail around rectangular void. Gap on left for stair.
function rail(a,b){let dx=b.x-a.x,dz=b.z-a.z;lines.push({a:[a.x,1,a.z],b:[b.x,1,b.z],w:7});for(let t=.05;t<.98;t+=.1){let x=a.x+dx*t,z=a.z+dz*t;lines.push({a:[x,.08,z],b:[x,1,z],w:4})}}
rail({x:xL,z:zN},{x:xR,z:zN}); rail({x:xR,z:zN},{x:xR,z:zS}); rail({x:xR,z:zS},{x:xL,z:zS});
rail({x:xL,z:zN},{x:xL,z:-.9}); rail({x:xL,z:1.0},{x:xL,z:zS});
// Stairs descend from left landing into opening.
for(let i=0;i<10;i++) box(-3.45,-.02-i*.18,.05-i*.25,1.35,.16,.31,K.stair);
// Gold marker = paper's "View" corner, just outside lower-right opening.
box(3.55,.55,2.55,.16,1.1,.16,K.marker);

function cam(p){let x=p[0]-target.x,y=p[1]-target.y,z=p[2]-target.z,cy=Math.cos(yaw),sy=Math.sin(yaw),x1=x*cy-z*sy,z1=x*sy+z*cy,cp=Math.cos(pitch),sp=Math.sin(pitch),y1=y*cp-z1*sp,z2=y*sp+z1*cp;return[x1,y1,z2+11]}
function proj(p){let q=cam(p),s=zoom/Math.max(q[2],.2);return[innerWidth/2+q[0]*s,innerHeight*.52-q[1]*s,q[2]]}
function shade(h,k){let n=parseInt(h.slice(1),16);return `rgb(${(n>>16)*k|0},${((n>>8)&255)*k|0},${(n&255)*k|0})`}
function draw(){
 ctx.fillStyle='#202226';ctx.fillRect(0,0,innerWidth,innerHeight);
 let f=faces.map((v,i)=>({...v,d:v.p.map(cam).reduce((s,q)=>s+q[2],0)/4,i})).filter(v=>v.d>.2).sort((a,b)=>b.d-a.d);
 for(let v of f){let q=v.p.map(proj);ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);for(let i=1;i<q.length;i++)ctx.lineTo(q[i][0],q[i][1]);ctx.closePath();ctx.fillStyle=shade(v.color,.84+(v.i%3)*.06);ctx.fill();ctx.strokeStyle='#0006';ctx.lineWidth=1;ctx.stroke()}
 for(let l of lines){let a=proj(l.a),b=proj(l.b);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle=K.wood;ctx.lineWidth=l.w;ctx.stroke()}
}
function resize(){let d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);draw()} addEventListener('resize',resize);
let t0=[],dist=0;
cv.addEventListener('touchstart',e=>{e.preventDefault();t0=[...e.touches];if(t0.length==2)dist=Math.hypot(t0[0].clientX-t0[1].clientX,t0[0].clientY-t0[1].clientY)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();let t=[...e.touches];if(t.length==1&&t0.length==1){yaw+=(t[0].clientX-t0[0].clientX)*.008;pitch=Math.max(.04,Math.min(1.48,pitch+(t[0].clientY-t0[0].clientY)*.006))}if(t.length==2){let d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);if(dist)zoom=Math.max(35,Math.min(200,zoom*d/dist));dist=d}t0=t;draw()},{passive:false});
cv.addEventListener('touchend',e=>{t0=[...e.touches];dist=0},{passive:false});
function top(){yaw=0;pitch=1.48;zoom=112;target={x:0,y:0,z:-.15};draw()}
function player(){yaw=-.68;pitch=.12;zoom=155;target={x:-.2,y:.7,z:-.7};draw()}
function orbit(){yaw=-.55;pitch=.52;zoom=115;target={x:0,y:.45,z:-.2};draw()}
document.getElementById('topBtn').onclick=top;document.getElementById('playerBtn').onclick=player;document.getElementById('orbitBtn').onclick=orbit;
resize();top();
})();
</script></body></html>
