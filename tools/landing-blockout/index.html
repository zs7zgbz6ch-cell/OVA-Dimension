<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OVA-D Landing Blockout v0.2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202226;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#info{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));background:#111d;padding:9px 11px;border-radius:11px;font-size:12px;line-height:1.35;pointer-events:none}
#reset{position:fixed;z-index:5;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));padding:10px 13px;border:1px solid #ffffff55;border-radius:10px;background:#111e;color:#fff;font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"><b>OVA-D · Landing Blockout v0.2</b><br>Drag: orbit · pinch: zoom<br>Zero external libraries 😅</div>
<button id="reset">Reset view</button>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let yaw=-0.58,pitch=0.43,zoom=72, target={x:0,y:.55,z:-.45};
const polys=[], lines=[];
const col={floor:'#9a7552',wall:'#d4c7af',wood:'#573720',door:'#70462d',stone:'#888077',void:'#121315'};
function quad(a,b,c,d,color){polys.push({p:[a,b,c,d],color})}
function box(x,y,z,w,h,d,color){
 let X=w/2,Y=h/2,Z=d/2,v=[
 [x-X,y-Y,z-Z],[x+X,y-Y,z-Z],[x+X,y+Y,z-Z],[x-X,y+Y,z-Z],
 [x-X,y-Y,z+Z],[x+X,y-Y,z+Z],[x+X,y+Y,z+Z],[x-X,y+Y,z+Z]];
 quad(v[4],v[5],v[6],v[7],color);quad(v[1],v[0],v[3],v[2],color);
 quad(v[0],v[4],v[7],v[3],color);quad(v[5],v[1],v[2],v[6],color);
 quad(v[3],v[7],v[6],v[2],color);quad(v[0],v[1],v[5],v[4],color);
}
function floor(x,z,w,d){box(x,-.10,z,w,.2,d,col.floor)}
function beam(a,b,width=.14,height=.14,y=1,color=col.wood){
 let dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);
 // represented as thick 3D line; sufficient for railing
 lines.push({a:[a.x,y,a.z],b:[b.x,y,b.z],width:width*45,color});
 for(let t=.08;t<.96;t+=.11){let x=a.x+dx*t,z=a.z+dz*t;lines.push({a:[x,.08,z],b:[x,y,z],width:5,color})}
}
// Landing strips around a REAL open center.
floor(0,-3.25,11,2.3);floor(-4.45,-.35,2.1,4.1);floor(4.45,-.35,2.1,4.1);
const tip={x:0,z:3.15},A={x:-4.05,z:1.25},B={x:4.05,z:1.25};
function rotatedFloor(a,b,w){
 let dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz),nx=-dz/L*w/2,nz=dx/L*w/2;
 quad([a.x+nx,-.2,a.z+nz],[b.x+nx,-.2,b.z+nz],[b.x-nx,0,b.z-nz],[a.x-nx,0,a.z-nz],col.floor);
}
rotatedFloor(A,tip,1.25);rotatedFloor(tip,B,1.25);
box(0,-2.55,0,7.0,.1,5.7,col.void);
// Walls
box(0,1.5,-4.42,11.2,3,.22,col.wall);box(-5.48,1.5,-.6,.22,3,7.6,col.wall);box(5.48,1.5,-.6,.22,3,7.6,col.wall);
// Visual door panels/openings
box(-2.5,1.05,-4.28,1.05,2.1,.10,col.door); // guest hall
box(-.45,1.05,-4.27,1.25,2.1,.10,col.void); // courtyard/balcony
box(1.25,1.05,-4.28,1.05,2.1,.10,col.door); // Rionne
box(2.45,1.5,-4.05,.75,3,.75,col.stone); // chimney
box(3.65,1.05,-4.28,1.05,2.1,.10,col.door); // lucky guest
// right-hand turn
floor(5.95,-2.75,1.2,2);box(6.55,1.5,-2.75,.22,3,2.2,col.wall);
// V and side railings
beam(A,tip);beam(tip,B);beam(A,{x:-4.05,z:-2.05});beam({x:4.05,z:-2.05},B);
// descending stairs at distant left
for(let i=0;i<10;i++)box(-4.55,-.02-i*.18,-2.15+i*.30,1.35,.16,.32,col.wood);

function size(){let d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',size);

function cam(p){
 let x=p[0]-target.x,y=p[1]-target.y,z=p[2]-target.z;
 let cy=Math.cos(yaw),sy=Math.sin(yaw),x1=x*cy-z*sy,z1=x*sy+z*cy;
 let cp=Math.cos(pitch),sp=Math.sin(pitch),y1=y*cp-z1*sp,z2=y*sp+z1*cp;
 return [x1,y1,z2+11];
}
function proj(p){let q=cam(p),s=zoom/Math.max(q[2],.15);return [innerWidth/2+q[0]*s,innerHeight*.53-q[1]*s,q[2]]}
function shade(hex,k){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return `rgb(${r*k|0},${g*k|0},${b*k|0})`}
function draw(){
 ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#202226';ctx.fillRect(0,0,innerWidth,innerHeight);
 let faces=polys.map((f,i)=>{let q=f.p.map(cam),depth=q.reduce((s,p)=>s+p[2],0)/q.length;return {...f,depth,i}}).filter(f=>f.depth>.2).sort((a,b)=>b.depth-a.depth);
 for(let f of faces){let pts=f.p.map(proj);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=shade(f.color,.82+(f.i%3)*.08);ctx.fill();ctx.strokeStyle='#0005';ctx.lineWidth=1;ctx.stroke()}
 let ls=lines.map(l=>({...l,d:(cam(l.a)[2]+cam(l.b)[2])/2})).sort((a,b)=>b.d-a.d);
 for(let l of ls){let a=proj(l.a),b=proj(l.b);if(a[2]<.2||b[2]<.2)continue;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle=l.color;ctx.lineWidth=Math.max(2,l.width*zoom/Math.max(l.d,2)/8);ctx.stroke()}
}
let touches=[],lastDist=0,lastMid=null;
cv.addEventListener('touchstart',e=>{e.preventDefault();touches=[...e.touches];if(touches.length==2){lastDist=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);lastMid=[(touches[0].clientX+touches[1].clientX)/2,(touches[0].clientY+touches[1].clientY)/2]}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();let t=[...e.touches];
 if(t.length==1&&touches.length==1){yaw+=(t[0].clientX-touches[0].clientX)*.008;pitch+=(t[0].clientY-touches[0].clientY)*.006;pitch=Math.max(-.1,Math.min(1.2,pitch))}
 if(t.length==2){let d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);if(lastDist)zoom=Math.max(35,Math.min(150,zoom*d/lastDist));lastDist=d}
 touches=t;draw()},{passive:false});
cv.addEventListener('touchend',e=>{touches=[...e.touches];lastDist=0},{passive:false});
let down=false,lx=0,ly=0;cv.onpointerdown=e=>{if(e.pointerType==='touch')return;down=true;lx=e.clientX;ly=e.clientY};cv.onpointermove=e=>{if(!down)return;yaw+=(e.clientX-lx)*.008;pitch+=(e.clientY-ly)*.006;lx=e.clientX;ly=e.clientY;draw()};cv.onpointerup=()=>down=false;
function reset(){yaw=-.58;pitch=.43;zoom=72;draw()}document.getElementById('reset').onclick=reset;
size();
})();
</script></body></html>
