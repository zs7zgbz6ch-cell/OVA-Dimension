<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>OVA-D Landing Blockout</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202226;color:white;font-family:-apple-system,sans-serif;touch-action:none}canvas{display:block}#info{position:fixed;z-index:3;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));background:#111c;padding:9px 11px;border-radius:11px;font-size:12px;pointer-events:none}#reset{position:fixed;z-index:3;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));padding:10px 13px;border:1px solid #ffffff44;border-radius:10px;background:#111d;color:white;font-weight:700}</style></head><body><div id="info"><b>OVA-D · Landing Blockout v0.1</b><br>Drag: orbit · pinch: zoom/pan<br>Geometry only — ugly on purpose 😂</div><button id="reset">Reset view</button><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/controls/OrbitControls.js';
const S=new THREE.Scene();S.background=new THREE.Color(0x202226);
const C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.05,100);
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.target.set(0,.7,-.5);O.minDistance=3;O.maxDistance=20;
S.add(new THREE.HemisphereLight(0xffffff,0x443322,2.4));const L=new THREE.DirectionalLight(0xffd09a,2.2);L.position.set(-5,8,-7);S.add(L);
const M={floor:new THREE.MeshStandardMaterial({color:0x9a7552}),wall:new THREE.MeshStandardMaterial({color:0xd4c7af}),wood:new THREE.MeshStandardMaterial({color:0x573720}),door:new THREE.MeshStandardMaterial({color:0x70462d}),stone:new THREE.MeshStandardMaterial({color:0x888077}),void:new THREE.MeshStandardMaterial({color:0x171717})};
function box(x,y,z,w,h,d,m){let q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);S.add(q);return q}
function floor(x,z,w,d){box(x,-.1,z,w,.2,d,M.floor)}
// NORTH/BACK strip with doors; SOUTH is player side.
floor(0,-3.25,11,2.3); floor(-4.45,-.35,2.1,4.1); floor(4.45,-.35,2.1,4.1);
// V-shaped walkable arms nearest player; center remains an actual hole.
const tip={x:0,z:3.15},A={x:-4.05,z:1.25},B={x:4.05,z:1.25};
function between(a,b,width,mat,y=-.1,h=.2){let dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz),q=box((a.x+b.x)/2,y,(a.z+b.z)/2,width,h,len,mat);q.rotation.y=Math.atan2(dx,dz);return q}
between(A,tip,1.25,M.floor);between(tip,B,1.25,M.floor);
// central void shown only FAR below
box(0,-2.5,0,7.1,.1,5.8,M.void);
// outer back wall
box(0,1.5,-4.42,11.2,3,.22,M.wall);
// door/opening faces slightly forward of wall
function door(x){box(x,1.05,-4.29,1.05,2.1,.12,M.door)}
door(-2.5); /* closed guest hallway */
box(-.45,1.1,-4.29,1.25,2.2,.08,M.void); /* balcony/courtyard opening */
door(1.25); /* Rionne */
box(2.45,1.5,-4.05,.75,3,.75,M.stone); /* chimney */
door(3.65); /* lucky guest */
// side perimeter walls
box(-5.48,1.5,-.6,.22,3,7.6,M.wall);box(5.48,1.5,-.6,.22,3,7.6,M.wall);
// far-right hallway TURN, not a straight hotel corridor
floor(5.95,-2.75,1.2,2.0);box(6.55,1.5,-2.75,.22,3,2.2,M.wall);
// railing builder
function rail(a,b){let dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz),ang=Math.atan2(dx,dz),g=new THREE.Group();let top=new THREE.Mesh(new THREE.BoxGeometry(.13,.13,len),M.wood);top.position.y=1;g.add(top);for(let i=.2;i<len;i+=.42){let p=new THREE.Mesh(new THREE.BoxGeometry(.09,.82,.09),M.wood);p.position.set(0,.55,i-len/2);g.add(p)}g.position.set((a.x+b.x)/2,0,(a.z+b.z)/2);g.rotation.y=ang;S.add(g)}
rail(A,tip);rail(tip,B);rail({x:-4.05,z:1.25},{x:-4.05,z:-2.05});rail({x:4.05,z:-2.05},{x:4.05,z:1.25});
// stairs DOWN at distant left. Top meets landing, then steps descend away.
for(let i=0;i<10;i++)box(-4.55,-.02-i*.18,-2.15+i*.3,1.35,.16,.32,M.wood);
// scale posts
for(const [x,z] of [[-4.05,1.25],[0,3.15],[4.05,1.25],[-4.05,-2.05],[4.05,-2.05]])box(x,.65,z,.18,1.3,.18,M.wood);
function reset(){C.position.set(-7.6,4.4,8.5);O.target.set(0,.65,-.5);O.update()}reset();document.querySelector('#reset').onclick=reset;
function loop(){requestAnimationFrame(loop);O.update();R.render(S,C)}loop();
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
