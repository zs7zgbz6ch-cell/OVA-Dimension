<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>OVA-D · Milestone 01B</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090704;color:#f2dfb1;font-family:Georgia,serif;touch-action:none;-webkit-user-select:none;user-select:none}#scene{position:fixed;inset:0;background:url('assets/berklith-tavern.jpg') center/cover no-repeat}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 55%,rgba(0,0,0,.32) 100%)}#person{position:absolute;left:38%;top:91%;height:38vh;width:auto;transform:translate(-50%,-100%);transform-origin:50% 100%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25));pointer-events:none;opacity:1;will-change:left,top,height,opacity;transition:left 1.65s cubic-bezier(.22,.75,.22,1),top 1.65s cubic-bezier(.22,.75,.22,1),height 1.65s cubic-bezier(.22,.75,.22,1),opacity .75s ease}.tag{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:7px 10px;border:1px solid rgba(224,184,103,.4);background:rgba(13,9,5,.6);backdrop-filter:blur(10px);border-radius:10px;font-size:11px;letter-spacing:.12em}.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;padding:9px;background:rgba(13,9,5,.78);backdrop-filter:blur(12px);border:1px solid rgba(224,184,103,.48);border-radius:14px}.panel button{min-width:92px;border:1px solid rgba(224,184,103,.55);background:rgba(38,27,15,.9);color:#f2dfb1;border-radius:9px;padding:9px 13px;font:12px Georgia,serif;letter-spacing:.08em}.panel button:active{transform:scale(.97)}@media(max-width:700px){.tag{font-size:9px}.panel{width:calc(100% - 24px)}.panel button{flex:1;min-width:0;padding:9px 5px;font-size:11px}}
</style></head><body><div id="scene"><img id="person" src="assets/test-character-01.png" alt=""><div class="vignette"></div></div><div class="tag">MILESTONE 01B · STATIC IMAGE, DIRECTED MOVEMENT</div><div class="panel"><button data-pose="bar">BAR</button><button data-pose="approach">APPROACH</button><button data-pose="leave">LEAVE</button></div><script>
const person=document.querySelector('#person');
const poses={
 bar:{x:38,y:91,s:38,o:1,d:1650},
 approach:{x:57,y:105,s:82,o:1,d:1900},
 leave:{x:103,y:108,s:96,o:0,d:2100}
};
function go(name){const p=poses[name];person.style.transitionDuration=`${p.d}ms,${p.d}ms,${p.d}ms,${name==='leave'?900:650}ms`;person.style.left=p.x+'%';person.style.top=p.y+'%';person.style.height=p.s+'vh';person.style.opacity=p.o;}
document.querySelectorAll('button[data-pose]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.pose)));
go('bar');
</script></body></html>
