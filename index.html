<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120d09">
<title>OVA-D — Prototype 0.01: The Landing</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090705;font-family:Georgia,serif;color:#fff}
#game{position:fixed;inset:0;background:#090705;overflow:hidden;touch-action:manipulation}
#scene{position:absolute;inset:0;background:url("landing.png") center center/cover no-repeat;transform:scale(1.012);transition:filter .35s,transform .35s}
#scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 72% 36%,rgba(255,185,95,.05),transparent 20%),linear-gradient(90deg,rgba(0,0,0,.10),transparent 18%,transparent 82%,rgba(0,0,0,.08))}
.hot{position:absolute;border:0;background:transparent;cursor:pointer}
#door{left:82%;top:7%;width:17%;height:72%}
#lamp{left:68%;top:25%;width:11%;height:31%}
#picture{left:59%;top:12%;width:14%;height:28%}
#window{left:34%;top:5%;width:20%;height:45%}
#stairs{left:0;top:40%;width:47%;height:60%}
#secret{left:45%;top:8%;width:5%;height:16%}
#lampFx{position:absolute;left:72.3%;top:32%;width:4.5vw;height:4.5vw;max-width:70px;max-height:70px;border-radius:50%;background:rgba(255,170,70,.20);filter:blur(12px);pointer-events:none;animation:flicker 2.6s infinite alternate;transition:opacity .35s}
@keyframes flicker{from{transform:scale(.85);opacity:.45}to{transform:scale(1.15);opacity:.8}}
#toast{position:absolute;left:50%;bottom:max(7vh,calc(env(safe-area-inset-bottom) + 20px));transform:translateX(-50%) translateY(18px);max-width:min(78vw,650px);padding:12px 18px;border-radius:14px;background:rgba(13,9,7,.80);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 5px 30px rgba(0,0,0,.35);font-size:clamp(15px,2vw,21px);line-height:1.3;text-align:center;opacity:0;transition:.22s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#panel{position:absolute;right:max(4vw,env(safe-area-inset-right));top:max(7vh,env(safe-area-inset-top));width:min(30vw,360px);min-height:24vh;border:2px solid rgba(255,245,225,.8);background:linear-gradient(150deg,rgba(36,22,17,.97),rgba(8,7,6,.97));box-shadow:0 10px 40px #000;transform:translateX(130%);transition:.35s cubic-bezier(.2,.8,.2,1);padding:18px;display:flex;align-items:flex-end;font-size:clamp(18px,2.5vw,28px);font-style:italic}
#panel.show{transform:translateX(0)}
#title{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));font-size:12px;letter-spacing:.18em;opacity:.62;text-shadow:0 2px 8px #000;pointer-events:none}
#reset{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));border:0;border-radius:50%;width:36px;height:36px;background:rgba(10,8,6,.42);color:#fff;opacity:.28;font-size:17px}
#rotate{display:none;position:fixed;inset:0;z-index:20;background:#100c09;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:20px}
@media (orientation:portrait){#rotate{display:flex}}
body.lamp-off #lampFx{opacity:0}
body.lamp-off #scene{filter:brightness(.94)}
#fade{position:absolute;inset:0;background:#080604;opacity:0;pointer-events:none;transition:opacity .6s;z-index:8}
#fade.on{opacity:1}
</style>
</head>
<body>
<div id="game">
  <div id="scene"></div><div id="lampFx"></div>
  <button class="hot" id="door" aria-label="Rionne's door"></button>
  <button class="hot" id="lamp" aria-label="Lamp"></button>
  <button class="hot" id="picture" aria-label="Old picture"></button>
  <button class="hot" id="window" aria-label="Window"></button>
  <button class="hot" id="stairs" aria-label="Stairs"></button>
  <button class="hot" id="secret" aria-label="Old beam"></button>
  <div id="title">OVA-D · PROTOTYPE 0.01 · THE LANDING</div>
  <div id="toast"></div><div id="panel"></div><div id="fade"></div>
  <button id="reset" aria-label="Reset prototype">↺</button>
</div>
<div id="rotate">OVA-D is framed for landscape.<br><br>Turn your phone sideways. ❤️</div>
<script>
const $=s=>document.querySelector(s), toast=$("#toast"), panel=$("#panel"), fade=$("#fade");
const state=JSON.parse(localStorage.getItem("ovad001")||'{"door":0,"lamp":true,"secret":false}');
function save(){localStorage.setItem("ovad001",JSON.stringify(state))}
function say(t,ms=2400){toast.textContent=t;toast.classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove("show"),ms)}
function manga(t,ms=2600){panel.textContent=t;panel.classList.add("show");setTimeout(()=>panel.classList.remove("show"),ms)}
function lamp(){document.body.classList.toggle("lamp-off",!state.lamp)}
lamp();

$("#door").onclick=()=>{
 state.door++; save();
 if(state.door===1){say("The door opens a few centimeters…");setTimeout(()=>manga("Rionne: “Yes?”"),550)}
 else if(state.door===2){manga("Rionne: “You are remarkably bad at leaving.”")}
 else if(state.door===3){say("Click.  She locks the door.");setTimeout(()=>say("Rionne, through the door: “Go downstairs.”"),1200)}
 else {say(state.door%2 ? "Locked." : "…You get the distinct feeling you should stop.");}
};
$("#lamp").onclick=()=>{state.lamp=!state.lamp;save();lamp();say(state.lamp?"The lamp warms the landing again.":"You turn the lamp down.")}
$("#picture").onclick=()=>say("An old drawing of the Berklith Tavern. It used to be much smaller.",3200);
$("#window").onclick=()=>say("The courtyard is quiet. Evening is beginning to settle over the town.",3200);
$("#secret").onclick=()=>{state.secret=true;save();say("Two old sets of initials are carved into the beam:  J.B. + M.B.",3400)}
$("#stairs").onclick=()=>{fade.classList.add("on");setTimeout(()=>{say("Downstairs isn't built yet. But you can already hear the tavern waiting. ❤️",3800);fade.classList.remove("on")},650)}
$("#reset").onclick=()=>{localStorage.removeItem("ovad001");location.reload()};

let idle=setTimeout(()=>say("From behind Rionne's door:  …thump.   “Ow.”",3000),14000);
["pointerdown","touchstart"].forEach(e=>document.addEventListener(e,()=>{clearTimeout(idle)},{once:true}));
</script>
</body>
</html>
