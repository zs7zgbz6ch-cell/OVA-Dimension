<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090705"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png">
<title>OVA-D · Prototype 0.03.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}img{user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090705;color:#fff;font-family:Georgia,serif;overscroll-behavior:none}body{position:fixed;inset:0}#game{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#090705}.scene{position:absolute;inset:0;display:none}.scene.on{display:block}.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none}.hot{position:absolute;border:0;background:transparent;padding:0;z-index:8}.asset{position:absolute;pointer-events:none;user-select:none;-webkit-user-drag:none;z-index:4}
.world-space{position:absolute}#lampGlow{pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at center,rgba(255,190,95,.24) 0%,rgba(255,142,48,.10) 35%,rgba(255,130,30,0) 72%);mix-blend-mode:screen;transition:opacity .55s ease}#landing.lamp-on #lampGlow{opacity:1}
#stewman{left:11.8%;top:44.7%;width:21.0%;height:auto;z-index:3;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));transform-origin:50% 100%}#stewHot{left:10.8%;top:40%;width:24%;height:45%}#stairsUp{right:0;top:13%;width:18%;height:75%}#fireHot{left:0;top:30%;width:14%;height:39%}#barHot{left:25%;top:35%;width:28%;height:29%}
#toast{position:absolute;z-index:30;left:50%;bottom:max(5vh,calc(env(safe-area-inset-bottom) + 12px));transform:translate(-50%,15px);max-width:min(78vw,650px);padding:11px 17px;border-radius:13px;background:rgba(12,8,6,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 30px #0008;text-align:center;font-size:clamp(15px,2vw,21px);opacity:0;transition:.22s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}#panel{position:absolute;z-index:31;right:max(4vw,env(safe-area-inset-right));top:max(7vh,env(safe-area-inset-top));width:min(30vw,360px);min-height:23vh;border:2px solid #fffbd7cc;background:linear-gradient(150deg,#241611f7,#080706f7);box-shadow:0 10px 40px #000;transform:translateX(130%);transition:.35s;padding:18px;display:flex;align-items:flex-end;font-size:clamp(17px,2.3vw,27px);font-style:italic}#panel.show{transform:translateX(0)}#title{position:absolute;z-index:20;left:max(15px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));font:11px system-ui,sans-serif;letter-spacing:.17em;opacity:.55;text-shadow:0 2px 7px #000}#reset{position:absolute;z-index:25;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:34px;height:34px;border:0;border-radius:50%;background:#09070566;color:#fff;opacity:.25}#rotate{display:none;position:fixed;z-index:100;inset:0;background:#100c09;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:20px}@media(orientation:portrait){#rotate{display:flex}}#fade{position:absolute;z-index:40;inset:0;background:#080604;opacity:0;pointer-events:none;transition:opacity .45s}#fade.on{opacity:1}
</style></head><body><div id="game">
<section id="landing" class="scene"><img class="plate" src="assets/landing.png">
<div id="lampGlow" class="world-space" data-x="1087" data-y="188" data-w="301" data-h="395"></div>
<button class="hot world-space" id="landingDoor" data-x="1371" data-y="75" data-w="251" data-h="640"></button>
<button class="hot world-space" id="landingLamp" data-x="1154" data-y="254" data-w="134" data-h="226"></button>
<button class="hot world-space" id="landingWindow" data-x="585" data-y="66" data-w="284" data-h="358"></button>
<button class="hot world-space" id="landingStairs" data-x="17" data-y="461" data-w="635" data-h="461"></button>
<button class="hot world-space" id="landingBeam" data-x="485" data-y="18" data-w="105" data-h="155" aria-label="old support post"></button></section>
<section id="tavern" class="scene"><img class="plate" src="assets/berklith_mainroom_master.png"><img id="stewman" class="asset" src="assets/stewman_seated.png"><button class="hot" id="stewHot"></button><button class="hot" id="stairsUp"></button><button class="hot" id="fireHot"></button><button class="hot" id="barHot"></button></section>
<div id="title">OVA-D · PROTOTYPE 0.03.2</div><div id="toast"></div><div id="panel"></div><div id="fade"></div><button id="reset">↺</button></div><div id="rotate">OVA-D is framed for landscape.<br><br>Turn your phone sideways. ❤️</div>
<script>
const $=s=>document.querySelector(s),toast=$('#toast'),panel=$('#panel'),fade=$('#fade');
// Scene art behaves as game art, never as a Safari image/document target.
document.addEventListener('contextmenu',e=>{if(e.target.closest('#game'))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target.closest('#game'))e.preventDefault()});
let eventLocked=false,eventTimer=null;
function endEvent(){clearTimeout(eventTimer);eventTimer=null;toast.classList.remove('show');panel.classList.remove('show');eventLocked=false}
function beginEvent(ms){if(eventLocked)return false;eventLocked=true;clearTimeout(eventTimer);eventTimer=setTimeout(endEvent,ms);return true}
function bind(id,fn){$(id).onclick=()=>{if(eventLocked)return;fn()}}
// Landing interactions live in master-art coordinates (1672×941), not screen percentages.
// This keeps the same physical objects tappable across iPhone, Android, tablets and desktop.
function layoutWorldSpace(){
  const scene=$('#landing'), iw=1672, ih=941, vw=scene.clientWidth, vh=scene.clientHeight;
  if(!vw||!vh)return;
  const scale=Math.max(vw/iw,vh/ih), ox=(vw-iw*scale)/2, oy=(vh-ih*scale)/2;
  scene.querySelectorAll('.world-space').forEach(el=>{
    const x=+el.dataset.x,y=+el.dataset.y,w=+el.dataset.w,h=+el.dataset.h;
    el.style.left=(ox+x*scale)+'px'; el.style.top=(oy+y*scale)+'px';
    el.style.width=(w*scale)+'px'; el.style.height=(h*scale)+'px';
  });
}
window.addEventListener('resize',layoutWorldSpace,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(layoutWorldSpace,80),{passive:true});
let state=JSON.parse(localStorage.getItem('ovad002')||'{"scene":"landing","door":0,"stew":0,"secret":false,"lamp":false}');
function save(){localStorage.setItem('ovad002',JSON.stringify(state))}
// Decode every visual layer before play begins so separate character cels never pop in late.
async function preloadSceneArt(){
  const imgs=[...document.querySelectorAll('#game img')];
  await Promise.all(imgs.map(img=>{
    if(img.complete && img.naturalWidth){return img.decode?img.decode().catch(()=>{}):Promise.resolve()}
    return new Promise(resolve=>{
      const done=()=>{img.decode?img.decode().catch(()=>{}).finally(resolve):resolve()};
      img.addEventListener('load',done,{once:true});
      img.addEventListener('error',resolve,{once:true});
    });
  }));
}
function say(t,ms=2500){if(!beginEvent(ms))return;toast.textContent=t;toast.classList.add('show')}
function manga(t,ms=2800){if(!beginEvent(ms))return;panel.textContent=t;panel.classList.add('show')}
function sequence(lines){if(eventLocked)return;eventLocked=true;let i=0;const next=()=>{if(i>=lines.length){endEvent();return}const [t,ms=1800]=lines[i++];toast.textContent=t;toast.classList.add('show');eventTimer=setTimeout(()=>{toast.classList.remove('show');eventTimer=setTimeout(next,180)},ms)};next()}function syncWorld(){ $('#landing').classList.toggle('lamp-on',!!state.lamp) }function show(s){document.querySelectorAll('.scene').forEach(x=>x.classList.remove('on'));$('#'+s).classList.add('on');state.scene=s;syncWorld();if(s==='landing')requestAnimationFrame(layoutWorldSpace);save()}function travel(s){if(eventLocked)return;eventLocked=true;fade.classList.add('on');setTimeout(()=>{show(s);fade.classList.remove('on');eventLocked=false;if(s==='tavern'&&!state.seenTavern){state.seenTavern=true;save();setTimeout(()=>say('Warm air, firelight… and someone taking his stew very seriously.'),500)}},480)}
// Keep the game covered until all base plates and character layers are decoded.
document.documentElement.style.background='#090705';
$('#game').style.visibility='hidden';
preloadSceneArt().finally(()=>{show(state.scene||'landing');requestAnimationFrame(()=>{$('#game').style.visibility='visible'})});
bind('#landingDoor',()=>{state.door++;save();if(state.door===1)manga('Rionne: “Yes?”');else if(state.door===2)manga('Rionne: “You are remarkably bad at leaving.”');else if(state.door===3)sequence([['Click. She locks the door.',900],['Rionne, through the door: “Go downstairs.”',1800]]);else say('Locked.')});
bind('#landingLamp',()=>{state.lamp=!state.lamp;save();syncWorld();say(state.lamp?'The lamp burns a little brighter.':'The lamp settles back to a low flame.');});bind('#landingWindow',()=>say('Evening is settling over the courtyard.'));bind('#landingBeam',()=>{const first=!state.secret;state.secret=true;save();say(first?'J.B. + M.B. — carved into the old beam.':'The old initials are still there: J.B. + M.B.')});bind('#landingStairs',()=>travel('tavern'));
bind('#stairsUp',()=>travel('landing'));bind('#fireHot',()=>say('The hearth has been fed for the evening.'));bind('#barHot',()=>say('Most of the bottles are arranged with suspicious precision. The ledger is not.'));
bind('#stewHot',()=>{state.stew++;save();if(state.stew===1)manga('The traveler glances up. “Evening.”');else if(state.stew===2)say('He returns to the bowl. “Stew’s good.”');else if(state.stew===3)say('Still stew.');else if(state.stew===4)manga('He lowers the spoon. “…Do you need something?”');else say(state.stew%2?'He keeps eating.':'You decide to let the man have his dinner.')});
$('#reset').onclick=()=>{localStorage.removeItem('ovad002');location.reload()};
// Stop browser gestures; authored close-ups will replace browser zoom.
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});let last=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-last<300)e.preventDefault();last=n},{passive:false});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>reg.update()).catch(()=>{});
}
</script></body></html>
