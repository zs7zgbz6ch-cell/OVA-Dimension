<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>OVA-D · Milestone 01</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090704;color:#f2dfb1;font-family:Georgia,serif;touch-action:none;-webkit-user-select:none;user-select:none}#scene{position:fixed;inset:0;background:url('assets/berklith-tavern.jpg') center/cover no-repeat}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 55%,rgba(0,0,0,.32) 100%)}#person{position:absolute;left:50%;top:93%;height:64vh;width:auto;transform:translate(-50%,-100%);transform-origin:50% 100%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25));pointer-events:none}.panel{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));padding:10px 12px;background:rgba(13,9,5,.78);backdrop-filter:blur(12px);border:1px solid rgba(224,184,103,.48);border-radius:14px;display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr auto;gap:8px;align-items:center;font:12px -apple-system,BlinkMacSystemFont,sans-serif}.panel b{font-family:Georgia,serif;letter-spacing:.08em}.panel input{width:100%;accent-color:#d9aa55}.panel button{border:1px solid rgba(224,184,103,.55);background:rgba(38,27,15,.9);color:#f2dfb1;border-radius:9px;padding:7px 10px}.tag{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:7px 10px;border:1px solid rgba(224,184,103,.4);background:rgba(13,9,5,.6);border-radius:10px;font-size:11px;letter-spacing:.12em}.hidden{display:none}@media(max-width:700px){.panel{grid-template-columns:auto 1fr auto 1fr auto 1fr}.panel button{grid-column:1/-1;padding:5px}.tag{font-size:9px}}
</style></head><body><div id="scene"><img id="person" src="assets/test-character-01.png" alt=""><div class="vignette"></div></div><div class="tag">MILESTONE 01 · A PERSON IN THE WORLD</div><div class="panel" id="panel"><b>X</b><input id="x" type="range" min="0" max="100" step=".1"><b>Y</b><input id="y" type="range" min="30" max="110" step=".1"><b>SIZE</b><input id="s" type="range" min="20" max="110" step=".5"><button id="reset">RESET</button></div><script>
const person=document.querySelector('#person'),x=document.querySelector('#x'),y=document.querySelector('#y'),s=document.querySelector('#s');
let state=JSON.parse(localStorage.getItem('ovad_m01')||'null')||{x:58,y:96,s:68};
function draw(){x.value=state.x;y.value=state.y;s.value=state.s;person.style.left=state.x+'%';person.style.top=state.y+'%';person.style.height=state.s+'vh';localStorage.setItem('ovad_m01',JSON.stringify(state))}
[x,y,s].forEach((el,i)=>el.addEventListener('input',()=>{state[['x','y','s'][i]]=+el.value;draw()}));
document.querySelector('#reset').onclick=()=>{state={x:58,y:96,s:68};draw()};draw();
</script></body></html>
